fn(async () => ({ ...ok, status: 302, location: \"http://169.254.169.254/latest/meta-data\" }));","    await expect(fetchPublicPage(\"example.com\", { resolve, read })).rejects.toMatchObject({ status: \"invalid_input\" });","    expect(read).toHaveBeenCalledTimes(1);","  });","  it(\"checks DNS again for redirected hostnames\", async () => {","    const read = vi.fn(async () => ({ ...ok, status: 301, location: \"https://redirect.com/path\" }));","    await expect(fetchPublicPage(\"example.com\", { resolve: async host => host === \"redirect.com\" ? [{ address: \"10.0.0.5\", family: 4 }] : resolve(), read }))","      .rejects.toMatchObject({ status: \"invalid_input\" });","    expect(read).toHaveBeenCalledTimes(1);","  });","  it(\"bounds redirect loops\", async () => {","    const read = vi.fn(async () => ({ ...ok, status: 302, location: \"/next\" }));","    await expect(fetchPublicPage(\"example.com\", { resolve, read })).rejects.toMatchObject({ status: \"unavailable\" });","    expect(read).toHaveBeenCalledTimes(5);","  });","  it(\"keeps provider redirects on their service allowlist\", async () => {","    const read = vi.fn(async () => ({ ...ok, status: 302, location: \"https://other-public.com/\" }));","    await expect(fetchPublicPage(\"example.com\", { resolve, read, allowedHosts: [\"example.com\"] }))","      .rejects.toMatchObject({ status: \"unsupported\" });","    expect(read).toHaveBeenCalledTimes(1);","  });","  it(\"honors caller cancellation before DNS or network activity\", async () => {","    const controller = new AbortController(); controller.abort();","    const read = vi.fn(async () => ok);","    await expect(fetchPublicPage(\"example.com\", { resolve, read, signal: controller.signal })).rejects.toMatchObject({ status: \"unavailable\" });","    expect(read).not.toHaveBeenCalled();","  });","});","","describe(\"semantic extraction and retro rendering\", () => {","  it(\"extracts content and resolves useful links without scripts/forms/hidden text\", () => {","    const page = extractRetroPage(html, \"https://example.com/path/page\");","    expect(page.title).toBe(\"A & B\");","    expect(page.blocks.map(block => block.text).join(\" \")).not.toMatch(/Hidden secret|Invisible|injected|Login form/);","    expect(page.blocks.filter(block => block.kind === \"item\")).toHaveLength(2);","    expect(page.blocks.filter(block => block.text === \"Quoted words\")).toHaveLength(1);","    expect(page.links).toContainEqual({ label: \"Read guide\", url: \"https://example.com/guide\" });","    expect(page.links.some(link => link.url.startsWith(\"javascript:\"))).toBe(false);","  });","  it(\"rejects JavaScript-only shells rather than making up content\", () => {","    expect(() => extractRetroPage(Buffer.from('\u003ctitle>App\u003c/title>\u003cbody>\u003cdiv id=\"root\">\u003c/div>\u003cscript>boot()\u003c/script>\u003c/body>'), \"https://example.com\")).toThrow(/readable HTML/);","  });","  it(\"bounds extracted source content and marks truncation\", () => {","    const source = Buffer.from(`\u003cbody>\u003cmain>${Array.from({ length: 110 }, () => '\u003cp>Public content that must survive extraction with clear truncation at the configured limit.\u003c/p>').join(\"\")}\u003c/main>\u003c/body>`);","    const page = extractRetroPage(source, \"https://example.com\");","    expect(page.blocks).toHaveLength(100);","    expect(page.truncated).toBe(true);","  });","  it.each(RETRO_STYLES)(\"renders $name with escaped content, no active source markup, and explicit provenance\", style => {","    const page = extractRetroPage(html, \"https://example.com\");","    page.title = '\u003c/style>\u003cscript>alert(1)\u003c/script>';","    page.blocks.push({ kind: \"paragraph\", text: '\u003cimg src=x onerror=\"alert(1)\">' });","    page.links.push({ label: 'Unsafe \u003cscript>', url: 'javascript:alert(1)' });","    const result = renderRetroPage(page, style.id);","    expect(result).toContain(\"SIMULATED\");","    expect(result).toContain(\"script-src 'none'\");","    expect(result).not.toContain(\"\u003cscript>\");","    expect(result).not.toContain(\"\u003cimg\");","    expect(result).not.toContain('href=\"javascript:');","    expect(result).toContain('&lt;img src=x onerror=&quot;alert(1)&quot;&gt;');","    expect(result).toContain('target=\"_blank\" rel=\"noopener noreferrer\"');","    expect(result).not.toContain('href=\"about:');","  });","});",""],"notes":[[1,"Regression tests: read setup/mock boundaries, then each test name, action, expectation and cleanup. These tests demonstrate selected deterministic behavior, not live provider health or complete browser workflows."]]},{"name":"tests/server-only-stub.ts","lines":["// Vitest's Node environment is the server boundary; Next enforces the real marker.","export {};",""],"notes":[[1,"Regression tests: read setup/mock boundaries, then each test name, action, expectation and cleanup. These tests demonstrate selected deterministic behavior, not live provider health or complete browser workflows."]]},{"name":"tests/timeline.test.ts","lines":["import { beforeEach, describe, expect, it, vi } from \"vitest\";","import { captureTimeline, timelineCache } from \"@/lib/timeline\";","import { POST } from \"@/app/api/timeline/route\";","","const header = [\"urlkey\", \"timestamp\", \"original\", \"mimetype\", \"statuscode\", \"digest\", \"length\"];","const row = (timestamp: string, original = \"http://example.com/\", mime = \"text/html\", status = \"200\") =>","  [\"com,example)/\", timestamp, original, mime, status, \"digest\", \"10\"];","const response = (rows: string[][]) => new Response(JSON.stringify([header, ...rows]));","beforeEach(() => { timelineCache.clear(); vi.restoreAllMocks(); });","","describe(\"monthly timeline\", () => {","  it(\"bounds and collapses its query without changing exact-nearest queries\", async () => {","    let query: URL | undefined;","    const fetchImpl: typeof fetch = async input => { query = new URL(String(input)); return response([row(\"20070615120000\")]); };","    const result = await captureTimeline({ url: \"example.com\", date: \"2007-06-15\", year: 2007 }, { fetchImpl });","    expect(query!.searchParams.get(\"collapse\")).toBe(\"timestamp:6\");","    expect(query!.searchParams.get(\"limit\")).toBe(\"13\");","    expect(query!.searchParams.getAll(\"filter\")).toEqual([\"statuscode:200\", \"mimetype:text/html\"]);","    expect(query!.searchParams.get(\"from\")).toBe(\"20070101000000\");","    expect(result.captures[0].playback.iframeUrl).toContain(\"20070615120000if_/http://example.com/\");","  });","  it(\"sorts and samples months while excluding invalid or unsafe rows\", async () => {","    const fetchImpl: typeof fetch = async () => response([","      row(\"20070801000000\"), row(\"20070620000000\"), row(\"20070601000000\"),","      row(\"20070231000000\"), row(\"20070501000000\", \"javascript:alert(1)\"),","      row(\"20070401000000\", \"http://example.com/\", \"image/png\"),","      row(\"20070301000000\", \"http://example.com/\", \"text/html\", \"404\"),","      row(\"19950101000000\"), row(\"20990101000000\"),","    ]);","    const result = await captureTimeline({ url: \"example.com\", date: \"2007-06-15\", year: 2007 }, { fetchImpl });","    expect(result.captures.map(c => c.snapshot.timestamp)).toEqual([\"20070601000000\", \"20070801000000\"]);","    expect(result.captures[0].snapshot.distanceDays).toBe(14);","  });","  it(\"caches raw rows but recalculates distance for a different request date\", async () => {","    let calls = 0;","    const fetchImpl: typeof fetch = async () => { calls++; return response([row(\"20070601000000\")]); };","    await captureTimeline({ url: \"example.com\", date: \"2007-06-01\", year: 2007 }, { fetchImpl });","    const result = await captureTimeline({ url: \"example.com\", date: \"2007-06-15\", year: 2007 }, { fetchImpl });","    expect(calls).toBe(1);","    expect(result.captures[0].snapshot.distanceDays).toBe(14);","  });","  it(\"keeps empty results distinct from archive failures and does not cache failures\", async () => {","    const fetchImpl: typeof fetch = async () => { throw new Error(\"offline\"); };","    await expect(captureTimeline({ url: \"example.com\", date: \"2007\", year: 2007 }, { fetchImpl })).rejects.toMatchObject({ status: \"archive_unavailable\" });","    expect(timelineCache.size).toBe(0);","    const result = await captureTimeline({ url: \"example.com\", date: \"2007\", year: 2007 }, { fetchImpl: async () => new Response(\"[]\") });","    expect(result.captures).toEqual([]);","    expect(result.truncated).toBe(false);","  });","  it(\"does not reuse cached rows for another year\", async () => {","    const fetchImpl: typeof fetch = async input => {","      const year = new URL(String(input)).searchParams.get(\"from\")!.slice(0, 4);","      return response([row(`${year}0601000000`)]);","    };","    await captureTimeline({ url: \"example.com\", date: \"2007\", year: 2007 }, { fetchImpl });","    const result = await captureTimeline({ url: \"example.com\", date: \"2007\", year: 2008 }, { fetchImpl });","    expect(result.captures[0].snapshot.timestamp).toBe(\"20080601000000\");","    expect(result.searchWindow).toEqual({ from: \"20080101\", to: \"20081231\" });","  });","  it(\"reports extra upstream rows without returning duplicate months\", async () => {","    const fetchImpl: typeof fetch = async () => response(Array.from({ length: 13 }, () => row(\"20070601000000\")));","    const result = await captureTimeline({ url: \"example.com\", date: \"2007\", year: 2007 }, { fetchImpl });","    expect(result.truncated).toBe(true);","    expect(result.captures).toHaveLength(1);","  });","});","","function request(body: unknown) {","  return new Request(\"http://localhost/api/timeline\", { method: \"POST\", body: JSON.stringify(body) });","}","describe(\"POST /api/timeline\", () => {","  it.each([null, {}, { url: \"example.com\", date: \"2007\" },","    ...[1995, 9999, 2007.5, \"2007\"].map(year => ({ url: \"example.com\", date: \"2007\", year })),","    { url: \"example.com\", date: \"2007-02-31\", year: 2007 }, { url: \"mailto:a@example.com\", date: \"2007\", year: 2007 }])(\"rejects invalid input %j before archive access\", async body => {","    const fetchMock = vi.spyOn(globalThis, \"fetch\");","    const result = await POST(request(body));","    expect(result.status).toBe(400);","    expect((await result.json()).status).toBe(\"invalid_input\");","    expect(fetchMock).not.toHaveBeenCalled();","  });","  it(\"returns monthly captures\", async () => {","    vi.spyOn(globalThis, \"fetch\").mockImplementation(async () => response([row(\"20070601000000\")]));","    const result = await POST(request({ url: \"example.com\", date: \"2007\", year: 2007 }));","    expect(result.status).toBe(200);","    expect((await result.json()).captures).toHaveLength(1);","  });","  it(\"rejects malformed JSON\", async () => {","    const result = await POST(new Request(\"http://localhost/api/timeline\", { method: \"POST\", body: \"{\" }));","    expect(result.status).toBe(400);","  });","  it(\"returns an archive error without crashing\", async () => {","    vi.spyOn(globalThis, \"fetch\").mockRejectedValue(new Error(\"offline\"));","    const result = await POST(request({ url: \"example.com\", date: \"2007\", year: 2007 }));","    expect(result.status).toBe(502);","    expect((await result.json()).status).toBe(\"archive_unavailable\");","  });","});",""],"notes":[[1,"Regression tests: read setup/mock boundaries, then each test name, action, expectation and cleanup. These tests demonstrate selected deterministic behavior, not live provider health or complete browser workflows."]]},{"name":"tests/wayback.test.ts","lines":["import { describe, it, expect, beforeEach } from \"vitest\";","import {","  parseCdxTimestamp,","  urlVariants,","  buildPlaybackUrls,","  parseCdxResponse,","  queryWaybackCdx,","  selectClosestSnapshot,","  resurrect,","  cdxCache,","} from \"@/lib/wayback\";","import { formatDateForDisplay, parseRequestedDate, normalizeUrl } from \"@/lib/validation\";","import { ResurrectError } from \"@/lib/errors\";","import type { CdxRow } from \"@/lib/wayback\";","","const HEADER = [\"urlkey\", \"timestamp\", \"original\", \"mimetype\", \"statuscode\", \"digest\", \"length\"];","","function row(","  timestamp: string,","  opts: Partial\u003c{ mimetype: string; statuscode: string; original: string }> = {},","): [string, string, string, string, string, string, string] {","  return [","    \"com,youtube)/\",","    timestamp,","    opts.original ?? \"http://youtube.com/\",","    opts.mimetype ?? \"text/html\",","    opts.statuscode ?? \"200\",","    \"d\",","    \"1\",","  ];","}","","// CdxRow object helper for selectClosestSnapshot (which consumes objects, not raw arrays).","function objRow(","  timestamp: string,","  opts: Partial\u003c{ mimetype: string; statuscode: string; original: string }> = {},","): CdxRow {","  return {","    urlkey: \"com,youtube)/\",","    timestamp,","    original: opts.original ?? \"http://youtube.com/\",","    mimetype: opts.mimetype ?? \"text/html\",","    statuscode: opts.statuscode ?? \"200\",","    digest: \"d\",","    length: \"1\",","  };","}","","function cdxJson(rows: string[][]) {","  return JSON.stringify([HEADER, ...rows]);","}","","// Model CDX date bounds and chronological limits, including latest (-1).","function mockCdx(rows: string[][]): typeof fetch {","  return async (input) => {","    const params = new URL(String(input)).searchParams;","    const matches = rows.filter((r) => r[1] >= params.get(\"from\")! && r[1] \u003c= params.get(\"to\")!)","      .sort((a, b) => a[1].localeCompare(b[1]));","    const limit = Number(params.get(\"limit\"));","    return new Response(cdxJson(limit \u003c 0 ? matches.slice(limit) : matches.slice(0, limit)));","  };","}","","// Mock fetch that returns different responses per call (for www-fallback testing).","function mockCdxSequence(responses: string[][][]): typeof fetch {","  let i = 0;","  return (async () => {","    const rows = responses[Math.min(i, responses.length - 1)];","    i++;","    const body = rows.length === 0 ? \"[]\" : cdxJson(rows);","    return new Response(body, { status: 200, headers: { \"content-type\": \"application/json\" } });","  }) as unknown as typeof fetch;","}","","beforeEach(() => cdxCache.clear());","","describe(\"CDX recovery\", () => {","  const from = new Date(\"2007-01-01T00:00:00Z\");","  const to = new Date(\"2007-12-31T00:00:00Z\");","  it.each([429, 503])(\"retries HTTP %s once and recovers\", async (status) => {","    let calls = 0;","    const fetchImpl: typeof fetch = async () => ++calls === 1","      ? new Response(\"busy\", { status, headers: { \"Retry-After\": \"0.001\" } })","      : new Response(cdxJson([row(\"20070615120905\")]));","    const result = await queryWaybackCdx(\"http://youtube.com/\", from, to, { fetchImpl });","    expect(calls).toBe(2);","    expect(result[0].timestamp).toBe(\"20070615120905\");","  });","  it(\"stops after a failed retry\", async () => {","    let calls = 0;","    const fetchImpl: typeof fetch = async () => {","      calls++;","      return new Response(\"busy\", { status: 503, headers: { \"Retry-After\": \"0.001\" } });","    };","    await expect(queryWaybackCdx(\"http://youtube.com/\", from, to, { fetchImpl }))","      .rejects.toMatchObject({ status: \"archive_unavailable\" });","    expect(calls).toBe(2);","  });","  it(\"cancels the retry wait when the caller aborts\", async () => {","    const controller = new AbortController();","    let calls = 0;","    const fetchImpl: typeof fetch = async () => {","      calls++;","      controller.abort();","      return new Response(\"busy\", { status: 429, headers: { \"Retry-After\": \"10\" } });","    };","    await expect(queryWaybackCdx(\"http://youtube.com/\", from, to, { fetchImpl, signal: controller.signal }))","      .rejects.toMatchObject({ status: \"archive_unavailable\" });","    expect(calls).toBe(1);","  });","});","","describe(\"parseCdxTimestamp\", () => {","  it(\"parses a 14-digit UTC timestamp\", () => {","    expect(parseCdxTimestamp(\"20070615120905\").toISOString()).toBe(\"2007-06-15T12:09:05.000Z\");","  });","  it(\"pads shorter timestamps with zeros\", () => {","    expect(parseCdxTimestamp(\"20070615\").toISOString()).toBe(\"2007-06-15T00:00:00.000Z\");","  });","});","","describe(\"formatDateForDisplay\", () => {","  it(\"formats a UTC date\", () => {","    expect(formatDateForDisplay(new Date(Date.UTC(2007, 5, 15)))).toBe(\"June 15, 2007\");","  });","});","","describe(\"parseRequestedDate\", () => {","  it(\"parses YYYY-MM-DD\", () => {","    const { date, display } = parseRequestedDate(\"2007-06-15\");","    expect(date.toISOString()).toBe(\"2007-06-15T00:00:00.000Z\");","    expect(display).toBe(\"June 15, 2007\");","  });","  it(\"defaults month/day for YYYY\", () => {","    expect(parseRequestedDate(\"2007\").date.toISOString()).toBe(\"2007-01-01T00:00:00.000Z\");","  });","  it(\"defaults day for YYYY-MM\", () => {","    expect(parseRequestedDate(\"2007-06\").date.toISOString()).toBe(\"2007-06-01T00:00:00.000Z\");","  });","  it(\"rejects bad format\", () => {","    expect(() => parseRequestedDate(\"not-a-date\")).toThrow(ResurrectError);","  });","  it(\"rejects bad month\", () => {","    expect(() => parseRequestedDate(\"2007-13\")).toThrow(ResurrectError);","  });","  it.each([\"2007-02-29\", \"2007-02-31\", \"2007-04-31\", \"1900-02-29\"])(","    \"rejects nonexistent date %s\",","    (date) => expect(() => parseRequestedDate(date)).toThrow(ResurrectError),","  );","  it(\"accepts leap days in leap years\", () => {","    expect(parseRequestedDate(\"2000-02-29\").date.toISOString()).toBe(\"2000-02-29T00:00:00.000Z\");","  });","  it(\"accepts a far-future date (no_snapshot is decided by the archive, not validation)\", () => {","    expect(parseRequestedDate(\"2099-06-15\").date.toISOString()).toBe(\"2099-06-15T00:00:00.000Z\");","  });","});","","describe(\"normalizeUrl\", () => {","  it.each([\"mailto:user@example.com\", \"ftp://example.com\", \"javascript:alert(1)\", \"https://user:pass@example.com\"])(","    \"rejects unsupported website input %s\",","    (input) => expect(() => normalizeUrl(input)).toThrow(ResurrectError),","  );","  it(\"removes fragments while preserving the path and query\", () => {","    expect(normalizeUrl(\"https://example.com/page?q=hello#section\")).toBe(\"https://example.com/page?q=hello\");","  });","  it(\"accepts a domain with a port\", () => {","    expect(normalizeUrl(\"example.com:8080/path\")).toBe(\"http://example.com:8080/path\");","  });","  it(\"adds an http scheme when missing\", () => {","    expect(normalizeUrl(\"youtube.com\")).toBe(\"http://youtube.com/\");","  });","  it(\"keeps https\", () => {","    expect(normalizeUrl(\"https://example.com/path\")).toBe(\"https://example.com/path\");","  });","  it(\"rejects empty\", () => expect(() => normalizeUrl(\"\")).toThrow(ResurrectError));","  it(\"rejects a value with no dotted domain\", () => {","    expect(() => normalizeUrl(\"localhost\")).toThrow(ResurrectError);","  });","});","","describe(\"urlVariants\", () => {","  it(\"adds a www variant when missing\", () => {","    const v = urlVariants(\"http://youtube.com/\");","    expect(v).toContain(\"http://youtube.com/\");","    expect(v).toContain(\"http://www.youtube.com/\");","  });","  it(\"removes www when present\", () => {","    const v = urlVariants(\"http://www.youtube.com/\");","    expect(v).toContain(\"http://youtube.com/\");","  });","});","","describe(\"buildPlaybackUrls\", () => {","  it(\"builds the if_ (iframe) and canonical playback URLs\", () => {","    const p = buildPlaybackUrls(\"20070615120905\", \"http://youtube.com/\");","    expect(p.iframeUrl).toBe(\"https://web.archive.org/web/20070615120905if_/http://youtube.com/\");","    expect(p.canonicalUrl).toBe(\"https://web.archive.org/web/20070615120905/http://youtube.com/\");","  });","});","","describe(\"parseCdxResponse\", () => {","  it(\"parses rows using the header\", () => {","    const rows = parseCdxResponse([HEADER, row(\"20070615120905\")]);","    expect(rows).toHaveLength(1);","    expect(rows[0].timestamp).toBe(\"20070615120905\");","    expect(rows[0].original).toBe(\"http://youtube.com/\");","  });","  it(\"returns [] for a truly empty response\", () => {","    expect(parseCdxResponse([])).toEqual([]);","  });","  it(\"returns [] for a header-only response\", () => {","    expect(parseCdxResponse([HEADER])).toEqual([]);","  });","  it(\"throws on a malformed (non-array) response\", () => {","    expect(() => parseCdxResponse({})).toThrow(ResurrectError);","  });","});","","describe(\"selectClosestSnapshot\", () => {","  const target = new Date(Date.UTC(2007, 5, 15));","  it(\"selects the closest capture\", () => {","    const rows = [objRow(\"20070601000000\"), objRow(\"20070620000000\"), objRow(\"20071001000000\")];","    expect(selectClosestSnapshot(rows, target)?.row.timestamp).toBe(\"20070620000000\");","  });","  it(\"breaks ties to the earliest capture\", () => {","    const rows = [objRow(\"20070614120000\"), objRow(\"20070615120000\")]; // both 12h from midnight","    expect(selectClosestSnapshot(rows, target)?.row.timestamp).toBe(\"20070614120000\");","  });","  it(\"filters out non-html and non-200 captures\", () => {","    const rows = [","      objRow(\"20070615120000\", { mimetype: \"image/jpeg\" }),","      objRow(\"20070620120000\", { statuscode: \"404\" }),","      objRow(\"20070620120000\", { mimetype: \"text/html\", statuscode: \"200\" }),","    ];","    const c = selectClosestSnapshot(rows, target);","    expect(c?.row.mimetype).toBe(\"text/html\");","    expect(c?.row.statuscode).toBe(\"200\");","  });","  it(\"returns undefined when no usable capture exists\", () => {","    expect(","      selectClosestSnapshot([objRow(\"20070615120000\", { mimetype: \"image/jpeg\" })], target),","    ).toBeUndefined();","  });","});","","describe(\"resurrect (mocked CDX)\", () => {","  it(\"finds the nearest capture in dense archives without paging or daily collapse\", async () => {","    const requests: URL[] = [];","    const archive = mockCdx([","      ...Array.from({ length: 500 }, () => row(\"20070101000000\")),","      row(\"20070614000100\"), row(\"20070614235959\"), row(\"20070615010000\"),","    ]);","    const fetchImpl: typeof fetch = async (input, init) => {","      requests.push(new URL(String(input)));","      return archive(input, init);","    };","    const result = await resurrect({ url: \"youtube.com\", date: \"2007-06-15\" }, { fetchImpl });","    expect(result.snapshot.timestamp).toBe(\"20070614235959\");","    expect(requests).toHaveLength(2);","    expect(requests.map((r) => r.searchParams.get(\"limit\"))).toEqual([\"-1\", \"1\"]);","    expect(requests.every((r) => !r.searchParams.has(\"collapse\"))).toBe(true);","  });","","  it(\"does not cache incomplete results if either side fails\", async () => {","    let calls = 0;","    const fetchImpl: typeof fetch = async () => {","      if (calls++ > 0) throw new Error(\"network down\");","      return new Response(cdxJson([row(\"20070614000000\")]));","    };","    await expect(resurrect({ url: \"youtube.com\", date: \"2007-06-15\" }, { fetchImpl }))","      .rejects.toMatchObject({ status: \"archive_unavailable\" });","    expect(cdxCache.size).toBe(0);","  });","  it(\"finds sparse captures beyond the old two-month window\", async () => {","    const r = await resurrect({ url: \"youtube.com\", date: \"2007-06-15\" }, {","      fetchImpl: mockCdx([row(\"20070201000000\")]),","    });","    expect(r.snapshot.timestamp).toBe(\"20070201000000\");","    expect(r.searchWindow).toEqual({ from: \"20061215\", to: \"20071215\" });","  });","  it(\"clamps month ends and includes the last day of the searched range\", async () => {","    const r = await resurrect({ url: \"youtube.com\", date: \"2007-08-31\" }, {","      fetchImpl: mockCdx([row(\"20080229235959\")]),","    });","    expect(r.searchWindow).toEqual({ from: \"20070228\", to: \"20080229\" });","    expect(r.snapshot.timestamp).toBe(\"20080229235959\");","  });","  it(\"includes the searched range when there are no captures\", async () => {","    await expect(resurrect({ url: \"youtube.com\", date: \"2007-06-15\" }, { fetchImpl: mockCdx([]) }))","      .rejects.toMatchObject({ status: \"no_snapshot\", message: expect.stringContaining(\"December 15, 2006 to December 15, 2007\") });","  });","  it(\"caches both candidates for repeated requests\", async () => {","    let calls = 0;","    const archive = mockCdx([row(\"20070614235959\")]);","    const fetchImpl: typeof fetch = async (input, init) => { calls++; return archive(input, init); };","    await resurrect({ url: \"youtube.com\", date: \"2007-06-15\" }, { fetchImpl });","    await resurrect({ url: \"youtube.com\", date: \"2007-06-15\" }, { fetchImpl });","    expect(calls).toBe(2);","  });","  it(\"finds the closest snapshot and builds playback URLs\", async () => {","    const fetchImpl = mockCdx([row(\"20070601000000\"), row(\"20070620000000\"), row(\"20071001000000\")]);","    const r = await resurrect({ url: \"youtube.com\", date: \"2007-06-15\" }, { fetchImpl });","    expect(r.snapshot.timestamp).toBe(\"20070620000000\");","    expect(r.snapshot.displayDate).toBe(\"June 20, 2007\");","    expect(r.requestedDate).toBe(\"June 15, 2007\");","    expect(r.snapshot.distanceDays).toBe(5);","    expect(r.playback.iframeUrl).toBe(\"https://web.archive.org/web/20070620000000if_/http://youtube.com/\");","  });","","  it(\"falls back to a www variant when the first returns nothing\", async () => {","    const fetchImpl = mockCdxSequence([[], [], [], [row(\"20070620000000\", { original: \"http://www.youtube.com/\" })]]);","    const r = await resurrect({ url: \"youtube.com\", date: \"2007-06-15\" }, { fetchImpl });","    expect(r.snapshot.timestamp).toBe(\"20070620000000\");","    expect(r.snapshot.originalUrl).toBe(\"http://www.youtube.com/\");","  });","","  it(\"throws no_snapshot when the archive returns no rows\", async () => {","    const fetchImpl = mockCdx([]);","    await expect(","      resurrect({ url: \"nope.com\", date: \"2007-06-15\" }, { fetchImpl }),","    ).rejects.toMatchObject({ status: \"no_snapshot\" });","  });","","  it(\"throws archive_unavailable on a fetch error\", async () => {","    const fetchImpl = (async () => {","      throw new Error(\"network down\");","    }) as unknown as typeof fetch;","    await expect(","      resurrect({ url: \"youtube.com\", date: \"2007-06-15\" }, { fetchImpl }),","    ).rejects.toMatchObject({ status: \"archive_unavailable\" });","  });","","  it(\"throws archive_unavailable on a malformed response\", async () => {","    const fetchImpl = (async () => new Response(\"not json\", { status: 200 })) as unknown as typeof fetch;","    await expect(","      resurrect({ url: \"youtube.com\", date: \"2007-06-15\" }, { fetchImpl }),","    ).rejects.toMatchObject({ status: \"archive_unavailable\" });","  });","","  it(\"throws invalid_input for an empty url without calling fetch\", async () => {","    let called = false;","    const fetchImpl = (async () => {","      called = true;","      return new Response(\"[]\");","    }) as unknown as typeof fetch;","    await expect(","      resurrect({ url: \"\", date: \"2007-06-15\" }, { fetchImpl }),","    ).rejects.toMatchObject({ status: \"invalid_input\" });","    expect(called).toBe(false);","  });","});",""],"notes":[[1,"Regression tests: read setup/mock boundaries, then each test name, action, expectation and cleanup. These tests demonstrate selected deterministic behavior, not live provider health or complete browser workflows."]]},{"name":"tsconfig.json","lines":["{","  \"compilerOptions\": {","    \"target\": \"ES2017\",","    \"lib\": [\"dom\", \"dom.iterable\", \"esnext\"],","    \"allowJs\": true,"," <script>
const data=JSON.parse(document.getElementById('source-data').textContent);
const byId=id=>document.getElementById(id);let active=data.files[0];
byId('revision').textContent='Source snapshot '+data.revision+' · '+data.files.length+' source/config/test files · Offline: no API calls, keys or external libraries.';
function context(file,line){return file.notes.filter(item=>item[0]<=line).at(-1)||file.notes[0];}
function selectLine(line,scroll=true){line=Math.max(1,Math.min(Number(line)||1,active.lines.length));document.querySelector('.row.selected')?.classList.remove('selected');const row=byId('L'+line);row?.classList.add('selected');byId('line').value=line;const note=context(active,line);byId('note').textContent=active.name+':'+line+' — '+note[1];if(scroll)row?.scrollIntoView({block:'center'});history.replaceState(null,'','#'+encodeURIComponent(active.name)+':'+line);}
function list(){const query=byId('search').value.toLowerCase();byId('files').replaceChildren();for(const file of data.files){if(query&&!file.name.toLowerCase().includes(query)&&!file.lines.some(line=>line.toLowerCase().includes(query)))continue;const b=document.createElement('button');b.textContent=file.name;b.setAttribute('aria-current',String(file===active));b.onclick=()=>open(file);byId('files').append(b);}}
function open(file,line=1){active=file;byId('title').textContent=file.name;byId('size').textContent=file.lines.length+' lines · explanations follow code blocks, not one claim per brace';byId('line').max=file.lines.length;const fragment=document.createDocumentFragment();file.lines.forEach((source,index)=>{const n=index+1;const start=file.notes.find(item=>item[0]===n);if(start){const s=document.createElement('div');s.className='section';s.textContent='Line '+n+' · '+start[1];fragment.append(s);}const row=document.createElement('div');row.className='row';row.id='L'+n;const number=document.createElement('button');number.className='ln';number.textContent=n;number.setAttribute('aria-label','Explain line '+n);number.onclick=()=>selectLine(n,false);const pre=document.createElement('pre');pre.textContent=source||' ';row.append(number,pre);fragment.append(row);});byId('code').replaceChildren(fragment);list();selectLine(line,false);}
byId('search').oninput=list;byId('go').onclick=()=>selectLine(byId('line').value);byId('line').onkeydown=e=>{if(e.key==='Enter')selectLine(byId('line').value);};
const match=/^(.*):(\d+)$/.exec(decodeURIComponent(location.hash.slice(1)));const initial=match&&data.files.find(file=>file.name===match[1]);open(initial||active,match?Number(match[2]):1);
</script></html>
