t { invalidInput } from \"./errors\";","","export function formatDateForDisplay(date: Date): string {","  return new Intl.DateTimeFormat(\"en-US\", {","    year: \"numeric\",","    month: \"long\",","    day: \"numeric\",","    timeZone: \"UTC\",","  }).format(date);","}","","","export interface ParsedRequestedDate {","  date: Date;","  display: string;","}","","/** Parse a user date (YYYY | YYYY-MM | YYYY-MM-DD) into a target Date + display string. */","export function parseRequestedDate(input: string): ParsedRequestedDate {","  const trimmed = input.trim();","  if (!trimmed) throw invalidInput(\"Date is required.\");","  const m = /^(\\d{4})(?:-(\\d{2}))?(?:-(\\d{2}))?$/.exec(trimmed);","  if (!m) throw invalidInput(\"Invalid date. Use YYYY, YYYY-MM, or YYYY-MM-DD.\");","  const year = Number(m[1]);","  const month = m[2] ? Number(m[2]) : 1;","  const day = m[3] ? Number(m[3]) : 1;","  if (month \u003c 1 || month > 12) throw invalidInput(\"Invalid month.\");","  if (day \u003c 1 || day > 31) throw invalidInput(\"Invalid day.\");","  if (year \u003c 1900) throw invalidInput(\"Invalid year.\");","  const date = new Date(Date.UTC(year, month - 1, day));","  if (","    Number.isNaN(date.getTime()) ||","    date.getUTCFullYear() !== year ||","    date.getUTCMonth() !== month - 1 ||","    date.getUTCDate() !== day","  ) throw invalidInput(\"Invalid date.\");","  return { date, display: formatDateForDisplay(date) };","}","","/** Normalize a user-entered URL: default scheme, require a dotted domain. */","export function normalizeUrl(input: string): string {","  const trimmed = input.trim();","  if (!trimmed) throw invalidInput(\"URL is required.\");","  if (/^[a-z][a-z\\d+.-]*:(?!\\d+(?:[/?#]|$))/i.test(trimmed) && !/^https?:\\/\\//i.test(trimmed)) {","    throw invalidInput(\"Invalid URL: use an HTTP or HTTPS website.\");","  }","  let withScheme = trimmed;","  if (!/^https?:\\/\\//i.test(withScheme)) withScheme = \"http://\" + withScheme;","  let parsed: URL;","  try {","    parsed = new URL(withScheme);","  } catch {","    throw invalidInput(\"Invalid URL: could not be parsed.\");","  }","  if (parsed.username || parsed.password) {","    throw invalidInput(\"Invalid URL: credentials are not supported.\");","  }","  if (!parsed.hostname || !parsed.hostname.includes(\".\")) {","    throw invalidInput(\"Invalid URL: must include a domain name.\");","  }","  // Fragments identify locations within a document and are never sent to servers.","  parsed.hash = \"\";","  return parsed.toString();","}","",""],"notes":[[1,"Shared client/server functions; no server SDK, credentials or fetch dependency."],[3,"Format dates in UTC to avoid local timezone shifts."],[13,"Return both parsed date and human-readable display text."],[19,"Restricted date regex, default missing components, numeric bounds, UTC construction and round-trip check reject rollover dates."],[41,"Normalize HTTP(S), reject unsupported protocols/credentials, require dotted host, remove fragment. This is NOT the stronger server-fetch SSRF policy."]]},{"name":"lib/wayback.ts","lines":["import { normalizeUrl, parseRequestedDate, formatDateForDisplay } from \"./validation\";","export { normalizeUrl, parseRequestedDate, formatDateForDisplay } from \"./validation\";","export type { ParsedRequestedDate } from \"./validation\";","import type { PlaybackUrls, ResurrectRequest, SnapshotMeta } from \"./types\";","import {","  archiveUnavailable,","  noHtmlSnapshot,","  noSnapshot,","} from \"./errors\";","import { TtlCache } from \"./cdx-cache\";","import { setTimeout as sleep } from \"node:timers/promises\";","","const CDX_BASE = \"https://web.archive.org/cdx/search/cdx\";","const PLAYBACK_BASE = \"https://web.archive.org/web\";","// Two bounded CDX queries preserve exact capture times even for dense archives.","const WINDOW_MONTHS = 6;","const CDX_TIMEOUT_MS = 15_000;","const CDX_LIMIT = 500;","","export interface CdxRow {","  urlkey: string;","  timestamp: string; // 14-digit UTC YYYYMMDDhhmmss","  original: string;","  mimetype: string;","  statuscode: string;","  digest: string;","  length: string;","}","","// Module-level cache: snapshots are immutable, so this is safe.","export const cdxCache = new TtlCache\u003cCdxRow[]>(15 * 60 * 1000);","","// ---------------------------------------------------------------------------","// Date helpers","// ---------------------------------------------------------------------------","","/** Parse a CDX timestamp (14-digit UTC, possibly shorter) into a Date. */","export function parseCdxTimestamp(ts: string): Date {","  const pad = ts.padEnd(14, \"0\");","  return new Date(","    Date.UTC(","      Number(pad.slice(0, 4)),","      Number(pad.slice(4, 6)) - 1,","      Number(pad.slice(6, 8)),","      Number(pad.slice(8, 10)),","      Number(pad.slice(10, 12)),","      Number(pad.slice(12, 14)),","    ),","  );","}","","function formatCdxDate(date: Date): string {","  const p = (n: number) => String(n).padStart(2, \"0\");","  return `${date.getUTCFullYear()}${p(date.getUTCMonth() + 1)}${p(date.getUTCDate())}`;","}","","function formatCdxTimestamp(date: Date): string {","  return date.toISOString().slice(0, 19).replace(/\\D/g, \"\");","}","","function addMonthsUTC(date: Date, months: number): Date {","  const result = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth() + months, 1));","  const lastDay = new Date(Date.UTC(result.getUTCFullYear(), result.getUTCMonth() + 1, 0)).getUTCDate();","  result.setUTCDate(Math.min(date.getUTCDate(), lastDay));","  return result;","}","","/** Candidate URL variants to try when an exact CDX match returns nothing. */","export function urlVariants(normalized: string): string[] {","  const variants = new Set\u003cstring>([normalized]);","  try {","    const parsed = new URL(normalized);","    const host = parsed.hostname;","    const alt = new URL(normalized);","    if (host.startsWith(\"www.\")) {","      alt.hostname = host.slice(4);","    } else {","      alt.hostname = \"www.\" + host;","    }","    variants.add(alt.toString());","  } catch {","    // ignore; the normalized URL is still used as-is","  }","  return [...variants];","}","","/** Build the iframe (`if_`) and canonical playback URLs for a snapshot. */","export function buildPlaybackUrls(timestamp: string, originalUrl: string): PlaybackUrls {","  return {","    iframeUrl: `${PLAYBACK_BASE}/${timestamp}if_/${originalUrl}`,","    canonicalUrl: `${PLAYBACK_BASE}/${timestamp}/${originalUrl}`,","  };","}","","// ---------------------------------------------------------------------------","// CDX parsing & querying","// ---------------------------------------------------------------------------","","/** Parse the CDX JSON response (array of arrays; first row is the header). */","export function parseCdxResponse(json: unknown): CdxRow[] {","  if (!Array.isArray(json)) {","    throw archiveUnavailable(\"Malformed CDX response: not an array.\");","  }","  if (json.length === 0) return [];","  const header = json[0];","  if (!Array.isArray(header)) {","    throw archiveUnavailable(\"Malformed CDX response: missing header row.\");","  }","  const cols = header as string[];","  const idx = (n: string) => cols.indexOf(n);","  const pos = {","    urlkey: idx(\"urlkey\"),","    timestamp: idx(\"timestamp\"),","    original: idx(\"original\"),","    mimetype: idx(\"mimetype\"),","    statuscode: idx(\"statuscode\"),","    digest: idx(\"digest\"),","    length: idx(\"length\"),","  };","  const rows: CdxRow[] = [];","  for (let r = 1; r \u003c json.length; r++) {","    const row = json[r];","    if (!Array.isArray(row)) continue;","    const g = (k: keyof typeof pos) => String(row[pos[k]] ?? \"\");","    rows.push({","      urlkey: g(\"urlkey\"),","      timestamp: g(\"timestamp\"),","      original: g(\"original\"),","      mimetype: g(\"mimetype\"),","      statuscode: g(\"statuscode\"),","      digest: g(\"digest\"),","      length: g(\"length\"),","    });","  }","  return rows;","}","","export interface QueryCdxOptions {","  fetchImpl?: typeof fetch;","  limit?: number;","  offset?: number;","  signal?: AbortSignal;","  collapse?: \"timestamp:6\";","}","","// Fetch the CDX URL, retrying once on rate-limiting (429) or temporary","// unavailability (503), honoring Retry-After when present.","async function fetchCdx(requestUrl: string, fetchImpl: typeof fetch, signal?: AbortSignal): Promise\u003cResponse> {","  const doFetch = () =>","    fetchImpl(requestUrl, {","      headers: { Accept: \"application/json\" },","      signal: AbortSignal.any([AbortSignal.timeout(CDX_TIMEOUT_MS), ...(signal ? [signal] : [])]),","    });","  let resp: Response;","  try {","    resp = await doFetch();","  } catch (e) {","    throw archiveUnavailable(","      `Archive lookup failed: ${e instanceof Error ? e.message : \"network error\"}`,","    );","  }","  if (resp.status === 429 || resp.status === 503) {","    const retryAfter = Number(resp.headers.get(\"retry-after\"));","    const delayMs =","      Number.isFinite(retryAfter) && retryAfter > 0 ? Math.min(retryAfter, 10) * 1000 : 2000;","    try {","      await sleep(delayMs, undefined, { signal });","      resp = await doFetch();","    } catch (e) {","      throw archiveUnavailable(","        `Archive lookup failed after retry: ${e instanceof Error ? e.message : \"network error\"}`,","      );","    }","  }","  return resp;","}","","/**"," * Query the Wayback CDX index for HTML/200 captures of `url` in [fromDate, toDate]."," * Keep full timestamp precision and do not collapse captures: even captures on"," * the same day can differ in their distance from the requested instant."," */","export async function queryWaybackCdx(","  url: string,","  fromDate: Date,","  toDate: Date,","  options: QueryCdxOptions = {},","): Promise\u003cCdxRow[]> {","  const fetchImpl = options.fetchImpl ?? fetch;","  const params = new URLSearchParams();","  params.set(\"url\", url);","  params.set(\"from\", formatCdxTimestamp(fromDate));","  params.set(\"to\", formatCdxTimestamp(toDate));","  params.set(\"output\", \"json\");","  params.append(\"filter\", \"statuscode:200\"); // append (not set): CDX takes multiple filters","  params.append(\"filter\", \"mimetype:text/html\");","  params.set(\"limit\", String(options.limit ?? CDX_LIMIT));","  if (options.collapse) params.set(\"collapse\", options.collapse);","  if (options.offset) params.set(\"offset\", String(options.offset));","  const requestUrl = `${CDX_BASE}?${params.toString()}`;","","  const resp = await fetchCdx(requestUrl, fetchImpl, options.signal);","  if (!resp.ok) throw archiveUnavailable(`Archive returned HTTP ${resp.status}.`);","  let json: unknown;","  try {","    json = await resp.json();","  } catch {","    throw archiveUnavailable(\"Archive returned a malformed response.\");","  }","  return parseCdxResponse(json);","}","","// ---------------------------------------------------------------------------","// Closest-snapshot selection","// ---------------------------------------------------------------------------","","/** Select the HTML/200 capture closest to `target`. Ties break to the earliest capture. */","export function selectClosestSnapshot(","  rows: CdxRow[],","  target: Date,","): { row: CdxRow; distanceDays: number } | undefined {","  const usable = rows.filter(","    (r) => r.mimetype === \"text/html\" && r.statuscode === \"200\" && r.timestamp.length >= 8,","  );","  if (usable.length === 0) return undefined;","  let bestRow: CdxRow | undefined;","  let bestDist = Infinity;","  let bestTime = Infinity;","  for (const row of usable) {","    const d = parseCdxTimestamp(row.timestamp);","    const dist = Math.abs(d.getTime() - target.getTime());","    if (dist \u003c bestDist || (dist === bestDist && d.getTime() \u003c bestTime)) {","      bestRow = row;","      bestDist = dist;","      bestTime = d.getTime();","    }","  }","  if (!bestRow) return undefined;","  return { row: bestRow, distanceDays: Math.round(bestDist / 86_400_000) };","}","","// ---------------------------------------------------------------------------","// Orchestration","// ---------------------------------------------------------------------------","","export interface ResurrectResult {","  snapshot: SnapshotMeta;","  playback: PlaybackUrls;","  requestedDate: string;","  searchWindow: { from: string; to: string };","}","","export interface ResurrectOptions {","  /** Injectable for tests; defaults to the global fetch. */","  fetchImpl?: typeof fetch;","  signal?: AbortSignal;","}","","/**"," * Turn a URL + date into the closest Wayback snapshot + playback URLs."," * Modular so the timeline browser (Milestone 2) can reuse queryWaybackCdx /"," * selectClosestSnapshot independently."," */","export async function resurrect(","  request: ResurrectRequest,","  options: ResurrectOptions = {},","): Promise\u003cResurrectResult> {","  const fetchImpl = options.fetchImpl ?? fetch;","  const normalized = normalizeUrl(request.url);","  const { date: target, display: requestedDate } = parseRequestedDate(request.date);","","  const fromDate = addMonthsUTC(target, -WINDOW_MONTHS);","  const toDate = addMonthsUTC(target, WINDOW_MONTHS);","  toDate.setUTCHours(23, 59, 59, 0);","  const searchWindow = { from: formatCdxDate(fromDate), to: formatCdxDate(toDate) };","  const rangeLabel = `${formatDateForDisplay(fromDate)} to ${formatDateForDisplay(toDate)}`;","  const signal = AbortSignal.any([","    AbortSignal.timeout(45_000),","    ...(options.signal ? [options.signal] : []),","  ]);","","  // Try the normalized URL first, then fall back to a www variant if needed.","  const variants = urlVariants(normalized);","  let allRows: CdxRow[] = [];","  for (const variant of variants) {","    const cacheKey = `nearest-v2|${variant}|${formatCdxTimestamp(target)}|${searchWindow.from}|${searchWindow.to}`;","    let rows = cdxCache.get(cacheKey);","    if (!rows) {","      // The closest capture must be either the last at/before the target or","      // the first at/after it. Negative CDX limits select the latest captures.","      // Both halves must succeed before selecting or caching a result.","      const [before, after] = await Promise.all([","        queryWaybackCdx(variant, fromDate, target, { fetchImpl, limit: -1, signal }),","        queryWaybackCdx(variant, target, toDate, { fetchImpl, limit: 1, signal }),","      ]);","      rows = [...before, ...after];","      cdxCache.set(cacheKey, rows);","    }","    allRows = allRows.concat(rows);","    if (allRows.length > 0) break;","  }","","  if (allRows.length === 0) {","    throw noSnapshot(`No HTML snapshots found from ${rangeLabel}. Tried with and without www.`);","  }","","  const closest = selectClosestSnapshot(allRows, target);","  if (!closest) {","    throw noHtmlSnapshot(\"Snapshots exist, but none are usable HTML/200 captures.\");","  }","","  const snapshotDate = parseCdxTimestamp(closest.row.timestamp);","  const snapshot: SnapshotMeta = {","    timestamp: closest.row.timestamp,","    displayDate: formatDateForDisplay(snapshotDate),","    originalUrl: closest.row.original,","    httpStatus: closest.row.statuscode,","    mimetype: closest.row.mimetype,","    digest: closest.row.digest,","    distanceDays: closest.distanceDays,","  };","  const playback = buildPlaybackUrls(closest.row.timestamp, closest.row.original);","  return { snapshot, playback, requestedDate, searchWindow };","}",""],"notes":[[1,"Reuse validation and typed contracts; import cache and abortable retry sleep."],[13,"Fixed CDX/playback hosts, six calendar months, per-fetch timeout. CDX rows include source metadata."],[31,"Module-level TTL cache shared by requests in this process only."],[38,"Parse fixed-position UTC timestamp fields, padding shorter date-only helper inputs."],[52,"Format archive date/timestamp strings without local timezone offsets."],[61,"Clamp month arithmetic using destination month's final day, preventing August 31 -> March rollover."],[69,"Generate original and www-toggled URL candidates using Set for uniqueness."],[88,"Create rewritten if_ playback and separate canonical provenance URLs."],[100,"Validate basic CDX array shape; locate fields by header name; convert rows. Missing-column/timestamp strictness is an improvement area."],[138,"Optional injected fetch supports deterministic tests. Timeline alone can request monthly collapse."],[148,"Combine timeout and caller abort signal. Retry 429/503 once; numeric Retry-After is capped at 10 seconds, so this is not complete Retry-After compliance."],[183,"Build encoded CDX query with exact bounds, repeated HTML/200 filters, limit, optional collapse/offset. Reject failed HTTP or malformed JSON."],[218,"O(n) filter and scan for minimum absolute elapsed time. Tie -> earlier capture. filter allocates O(n), not O(1) auxiliary memory."],[246,"Result and injection/cancellation contracts for orchestration."],[264,"Validate request, make inclusive clamped six-month range and 45-second total deadline."],[284,"Try the original variant first; key cache by variant, target and range. Parallel latest-before/earliest-after queries bound returned candidates. Cache only after both succeed."],[310,"Handle empty/unusable candidates, construct actual capture metadata, elapsed-day distance and playback URLs. Closest is within this window/first matching variant, not across the entire Internet."]]},{"name":"lib/cdx-cache.ts","lines":["// Tiny in-memory TTL cache for CDX responses. CDX snapshots are immutable for a","// given timestamp, so caching the index rows for a short window is safe and keeps","// repeat demo requests off the archive API.","","interface Entry\u003cT> {","  value: T;","  expiresAt: number;","}","","export class TtlCache\u003cT> {","  private store = new Map\u003cstring, Entry\u003cT>>();","","  constructor(private ttlMs = 15 * 60 * 1000, private maxEntries = 100) {","    if (!Number.isInteger(maxEntries) || maxEntries \u003c 1) {","      throw new RangeError(\"maxEntries must be a positive integer.\");","    }","  }","","  private prune(): void {","    const now = Date.now();","    for (const [key, entry] of this.store) {","      if (now >= entry.expiresAt) this.store.delete(key);","    }","  }","","  get(key: string): T | undefined {","    const entry = this.store.get(key);","    if (!entry) return undefined;","    if (Date.now() >= entry.expiresAt) {","      this.store.delete(key);","      return undefined;","    }","    return entry.value;","  }","","  set(key: string, value: T): void {","    this.prune();","    this.store.delete(key);","    if (this.store.size >= this.maxEntries) {","      this.store.delete(this.store.keys().next().value!);","    }","    this.store.set(key, { value, expiresAt: Date.now() + this.ttlMs });","  }","","  clear(): void {","    this.store.clear();","  }","","  get size(): number {","    this.prune();","    return this.store.size;","  }","}",""],"notes":[[1,"A generic Map stores value and absolute expiry time. TTL and maximum entry count are configurable."],[10,"Validate positive integer capacity. Entry order is insertion/overwrite order, NOT least-recently-used."],[19,"prune scans all entries: O(C). Expired entries disappear on later writes or size inspection."],[26,"get is expected O(1); checks just this key's expiry. Reading does not move it to the newest position."],[36,"set prunes, refreshes overwritten insertion order and evicts the oldest entry when full: O(C). clear empties; size prunes."]]},{"name":"components/SnapshotMeta.tsx","lines":["import type { ResurrectFoundResponse } from \"@/lib/types\";","","export function SnapshotMeta({","  data,","  requestedDate,","}: {","  data: ResurrectFoundResponse;","  requestedDate: string;","}) {","  const { snapshot, playback, source } = data;","  return (","    \u003cdiv className=\"rounded border border-neutral-800 bg-neutral-900/50 p-5 font-mono text-sm\">","      \u003cdiv className=\"mb-3 flex items-center justify-between\">","        \u003cspan className=\"uppercase tracking-wide text-neutral-400\">Snapshot\u003c/span>","        \u003cspan className=\"text-neutral-500\">{source}\u003c/span>","      \u003c/div>","      \u003cdl className=\"grid grid-cols-1 gap-x-6 gap-y-1 sm:grid-cols-2\">","        \u003cRow label=\"Requested\" value={requestedDate} />","        \u003cRow label=\"Captured\" value={snapshot.displayDate} />","        \u003cRow label=\"Searched range (UTC)\" value={`${displayRangeDate(data.searchWindow.from)} to ${displayRangeDate(data.searchWindow.to)}`} full />","        \u003cRow label=\"Distance\" value={`${snapshot.distanceDays} day${snapshot.distanceDays === 1 ? \"\" : \"s\"}`} />","        \u003cRow label=\"Status\" value={`HTTP ${snapshot.httpStatus}`} />","        \u003cRow label=\"Type\" value={snapshot.mimetype} />","        \u003cRow label=\"Timestamp\" value={snapshot.timestamp} />","        \u003cRow label=\"Original URL\" value={snapshot.originalUrl} full />","      \u003c/dl>","      \u003cdiv className=\"mt-4\">","        \u003ca","          href={playback.canonicalUrl}","          target=\"_blank\"","          rel=\"noopener noreferrer\"","          className=\"text-neutral-300 underline underline-offset-2 hover:text-neutral-100\"","        >","          View on Wayback Machine ↗","        \u003c/a>","      \u003c/div>","    \u003c/div>","  );","}","","function displayRangeDate(date: string): string {","  return `${date.slice(0, 4)}-${date.slice(4, 6)}-${date.slice(6, 8)}`;","}","","function Row({ label, value, full }: { label: string; value: string; full?: boolean }) {","  return (","    \u003cdiv className={full ? \"sm:col-span-2\" : undefined}>","      \u003cdt className=\"text-neutral-500\">{label}\u003c/dt>","      \u003cdd className=\"break-all text-neutral-100\">{value}\u003c/dd>","    \u003c/div>","  );","}",""],"notes":[[1,"Presentational metadata and real source links: requested date, actual capture, range, distance, HTTP status, type and original URL."],[41,"Display YYYYMMDD range as readable ISO-style date; Row uses dt/dd for semantic labels and values."]]},{"name":"components/SnapshotFrame.tsx","lines":["\"use client\";","","import { useEffect, useState } from \"react\";","import type { PlaybackUrls } from \"@/lib/types\";","","export function SnapshotFrame({ playback }: { playback: PlaybackUrls }) {","  const [staticMode, setStaticMode] = useState(false);","  const [attempt, setAttempt] = useState(0);","  return (","    \u003csection aria-label=\"Archived page viewer\">","      \u003cdiv className=\"mb-3 flex flex-wrap items-center justify-between gap-3\">","        \u003cspan className=\"text-xs uppercase tracking-wide text-neutral-400\">","          ARCHIVED · {staticMode ? \"Static safe mode\" : \"Interactive mode\"}","        \u003c/span>","        \u003cdiv className=\"flex flex-wrap items-center gap-3 text-sm\">","          \u003cbutton type=\"button\" onClick={() => setAttempt((value) => value + 1)}","            className=\"rounded border border-neutral-700 px-3 py-1 hover:bg-neutral-900\">","            Retry snapshot","          \u003c/button>","          \u003cbutton type=\"button\" aria-pressed={staticMode} onClick={() => setStaticMode((value) => !value)}","            className=\"rounded border border-neutral-700 px-3 py-1 hover:bg-neutral-900\">","            {staticMode ? \"Use interactive mode\" : \"Use static safe mode\"}","          \u003c/button>","          \u003ca href={playback.canonicalUrl} target=\"_blank\" rel=\"noopener noreferrer\"","            className=\"text-neutral-300 underline underline-offset-2\">Open on Wayback ↗\u003c/a>","        \u003c/div>","      \u003c/div>","      \u003cp className=\"mb-3 text-sm text-neutral-400\">","        {staticMode","          ? \"Archived scripts are disabled. Some content and interactions may be missing.\"","          : \"Archived scripts can run inside the isolated viewer. Switch to static safe mode if the page misbehaves.\"}","      \u003c/p>","      \u003cPlaybackAttempt key={`${playback.iframeUrl}|${staticMode}|${attempt}`}","        url={playback.iframeUrl} staticMode={staticMode} />","      \u003cp className=\"mt-2 text-sm text-neutral-400\">","        Blank or broken page? Retry, switch modes, or open the snapshot on Wayback.","        Archived resources may be missing.","      \u003c/p>","    \u003c/section>","  );","}","","// Each remount gives a new URL, mode, or retry an independent load timer.","// A cross-origin load event cannot prove that archived content rendered correctly.","function PlaybackAttempt({ url, staticMode }: { url: string; staticMode: boolean }) {","  const [status, setStatus] = useState\u003c\"loading\" | \"slow\" | \"loaded\" | \"error\">(\"loading\");","  useEffect(() => {","    if (status !== \"loading\") return;","    const timer = setTimeout(() => setStatus(\"slow\"), 20_000);","    return () => clearTimeout(timer);","  }, [status]);","  return (","    \u003c>","      \u003cp role=\"status\" className=\"mb-2 text-sm text-neutral-400\">","        {status === \"loading\" && \"Loading archived page…\"}","        {status === \"slow\" && \"The archive is taking longer than expected. The snapshot may be unavailable.\"}","        {status === \"loaded\" && \"The viewer finished loading. We cannot verify the archived page or its resources.\"}","        {status === \"error\" && \"The snapshot could not be loaded. Try the recovery controls above.\"}","      \u003c/p>","      \u003ciframe src={url} title=\"Archived webpage\"","        sandbox={staticMode ? \"\" : \"allow-scripts\"} referrerPolicy=\"no-referrer\"","        onLoad={() => setStatus(\"loaded\")} onError={() => setStatus(\"error\")}","        className=\"h-[75vh] w-full rounded border border-neutral-800 bg-white\" />","    \u003c/>","  );","}",""],"notes":[[1,"Outer viewer owns static mode and retry count; neither is an AI decision."],[9,"Recovery controls toggle script permissions or increment attempt. Canonical source remains accessible."],[31,"Child key includes URL/mode/attempt. Remount resets only the playback attempt, preserving outer mode."],[43,"Child status is loading/slow/loaded/error. Effect cleans timeout on transition or unmount."],[58,"iframe allows scripts OR no powers, never scripts plus same-origin. Load events cannot verify visible page correctness."]]},{"name":"components/CaptureTimeline.tsx","lines":["\"use client\";","","import { useEffect, useRef, useState } from \"react\";","import type { TimelineCapture, TimelineFoundResponse, TimelineResponse } from \"@/lib/types\";","","export function CaptureTimeline({ url, date, timestamp, onSelect }: {","  url: string;","  date: string;","  timestamp: string;","  onSelect: (capture: TimelineCapture, window: TimelineFoundResponse[\"searchWindow\"]) => void;","}) {","  const [data, setData] = useState\u003cTimelineFoundResponse | null>(null);","  const [loading, setLoading] = useState(false);","  const [error, setError] = useState\u003cstring | null>(null);","  const [year, setYear] = useState(timestamp.slice(0, 4));","  const controller = useRef\u003cAbortController | null>(null);","  useEffect(() => () => controller.current?.abort(), []);","","  async function load(selectedYear = year) {","    controller.current?.abort();","    const active = new AbortController();","    controller.current = active;","    setLoading(true);","    setError(null);","    try {","      const response = await fetch(\"/api/timeline\", {","        method: \"POST\", headers: { \"Content-Type\": \"application/json\" },","        body: JSON.stringify({ url, date, year: Number(selectedYear) }),","        signal: AbortSignal.any([active.signal, AbortSignal.timeout(60_000)]),","      });","      const result = await response.json() as TimelineResponse;","      if (result.status !== \"found\") throw new Error(result.message);","      if (!response.ok) throw new Error(\"Could not load the capture timeline.\");","      if (active.signal.aborted) return;","      setData(result);","      setYear(selectedYear);","    } catch (error) {","      if (!active.signal.aborted) setError(error instanceof Error ? error.message : \"Could not load the timeline.\");","    } finally {","      if (!active.signal.aborted) setLoading(false);","    }","  }","","  const currentYear = new Date().getUTCFullYear();","  const previous = data?.captures.findLast(capture => capture.snapshot.timestamp \u003c timestamp);","  const next = data?.captures.find(capture => capture.snapshot.timestamp > timestamp);","  function select(capture: TimelineCapture) {","    onSelect(capture, data!.searchWindow);","  }","  const button = \"rounded border border-neutral-700 px-3 py-2 text-sm hover:bg-neutral-800 disabled:opacity-40\";","  return (","    \u003csection aria-label=\"Capture timeline\" className=\"rounded border border-neutral-800 bg-neutral-900/40 p-5\">","      \u003ch2 className=\"mb-2 font-mono text-sm uppercase tracking-wide\">Capture timeline\u003c/h2>","      \u003cp className=\"mb-4 text-sm text-neutral-400\">Browse one year at a time, with one archived HTML capture per month for {url}. Asset completeness is unknown.\u003c/p>","      \u003cform className=\"mb-3 flex flex-wrap items-end gap-2\" onSubmit={event => { event.preventDefault(); void load(); }}>","        \u003clabel className=\"flex flex-col gap-1 text-sm text-neutral-400\">","          Timeline year","          \u003cinput type=\"number\" min={1996} max={currentYear} required value={year}","            onChange={event => setYear(event.target.value)} disabled={loading}","            className=\"w-28 rounded border border-neutral-700 bg-neutral-950 px-3 py-2 text-neutral-100\" />","        \u003c/label>","        \u003cbutton type=\"submit\" disabled={loading} className={button}>","          {loading ? \"Loading timeline…\" : error ? \"Retry timeline\" : data ? \"Load year\" : \"Explore capture timeline\"}","        \u003c/button>","        \u003cbutton type=\"button\" disabled={loading || Number(year) \u003c= 1996 || !year}","          onClick={() => { const value = String(Number(year) - 1); setYear(value); void load(value); }} className={button}>Previous year\u003c/button>","        \u003cbutton type=\"button\" disabled={loading || Number(year) >= currentYear || !year}","          onClick={() => { const value = String(Number(year) + 1); setYear(value); void load(value); }} className={button}>Next year\u003c/button>","      \u003c/form>","      {loading && \u003cp role=\"status\" className=\"mt-2 text-sm text-neutral-400\">Searching monthly captures…\u003c/p>}","      {error && \u003cp role=\"alert\" className=\"mt-3 text-sm text-amber-300\">{error} Your current snapshot is still available below.\u003c/p>}","      {data && data.captures.length === 0 && \u003cp role=\"status\" className=\"text-sm text-neutral-400\">No monthly samples were returned for {data.searchWindow.from.slice(0, 4)}. Your current snapshot is still available below.\u003c/p>}","      {data && data.captures.length > 0 && \u003c>","        \u003cp className=\"mb-3 text-xs text-neutral-400\">Monthly samples for {data.searchWindow.from.slice(0, 4)}. These are not all captures.\u003c/p>","        {data.truncated && \u003cp role=\"status\" className=\"mb-3 text-sm text-amber-300\">The archive returned more than 12 rows. Some samples may be omitted.\u003c/p>}","        \u003cdiv aria-label={`Captures in ${data.searchWindow.from.slice(0, 4)}`} className=\"flex flex-wrap gap-2\">","          {data.captures.map(capture =>","            \u003cbutton type=\"button\" key={capture.snapshot.timestamp} aria-pressed={capture.snapshot.timestamp === timestamp}","              onClick={() => select(capture)} className={`${button} ${capture.snapshot.timestamp === timestamp ? \"border-neutral-100 bg-neutral-800\" : \"\"}`}>","              {capture.snapshot.displayDate}","            \u003c/button>)}","        \u003c/div>","        \u003cdiv className=\"mt-4 flex flex-wrap gap-2\">","          \u003cbutton type=\"button\" disabled={!previous} onClick={() => previous && select(previous)} className={button}>Previous sample\u003c/button>","          \u003cbutton type=\"button\" disabled={!next} onClick={() => next && select(next)} className={button}>Next sample\u003c/button>","        \u003c/div>","      \u003c/>}","    \u003c/section>","  );","}",""],"notes":[[1,"Controlled capture selection callback; state holds sampled rows, year, request and error."],[19,"Abort previous request and enforce timeout. Ignore cancelled completions so stale results do not replace newer data."],[46,"Find previous/next sampled timestamp and emit selection to the archive controller."],[55,"Year controls, loading/error/empty messages and monthly sample buttons. Current iframe remains usable when optional timeline loading fails."]]},{"name":"app/api/timeline/route.ts","lines":["import { captureTimeline } from \"@/lib/timeline\";","import { ResurrectError } from \"@/lib/errors\";","import type { TimelineResponse } from \"@/lib/types\";","","export async function POST(request: Request) {","  let body: unknown;","  try { body = await request.json(); } catch {","    return Response.json({ status: \"invalid_input\", message: \"Request body must be valid JSON.\" }, { status: 400 });","  }","  if (!body || typeof body !== \"object\" || !(\"url\" in body) || !(\"date\" in body) ||","    typeof body.url !== \"string\" || typeof body.date !== \"string\" || !(\"year\" in body) || typeof body.year !== \"number\") {","    return Response.json({ status: \"invalid_input\", message: \"Provide a website, requested date, and timeline year.\" }, { status: 400 });","  }","  try {","    const result = await captureTimeline({ url: body.url, date: body.date, year: body.year }, { signal: request.signal });","    return Response.json(result satisfies TimelineResponse);","  } catch (error) {","    const result: TimelineResponse = error instanceof ResurrectError","      ? { status: error.status, message: error.message }","      : { status: \"archive_unavailable\", message: \"Could not load the capture timeline.\" };","    return Response.json(result, { status: result.status === \"invalid_input\" ? 400 : 502 });","  }","}",""],"notes":[[1,"Parse JSON URL/date/year; invoke timeline with request cancellation; map invalid input versus upstream failure to HTTP results."]]},{"name":"lib/timeline.ts","lines":["import { TtlCache } from \"./cdx-cache\";","import { ResurrectError } from \"./errors\";","import { normalizeUrl, parseRequestedDate, formatDateForDisplay } from \"./validation\";","import { buildPlaybackUrls, parseCdxTimestamp, queryWaybackCdx, type CdxRow } from \"./wayback\";","import type { ResurrectRequest, TimelineFoundResponse } from \"./types\";","","const MAX_CAPTURES = 12;","export const timelineCache = new TtlCache\u003cCdxRow[]>();","","export async function captureTimeline(","  request: ResurrectRequest & { year: number },","  options: { fetchImpl?: typeof fetch; signal?: AbortSignal } = {},","): Promise\u003cTimelineFoundResponse> {","  const url = normalizeUrl(request.url);","  const { date: target } = parseRequestedDate(request.date);","  const currentYear = new Date().getUTCFullYear();","  if (!Number.isInteger(request.year) || request.year \u003c 1996 || request.year > currentYear) {","    throw new ResurrectError(\"invalid_input\", `Choose a timeline year from 1996 to ${currentYear}.`);","  }","  const from = new Date(Date.UTC(request.year, 0, 1));","  const to = new Date();","  if (request.year \u003c currentYear) to.setTime(Date.UTC(request.year, 11, 31, 23, 59, 59));","  else to.setUTCHours(23, 59, 59, 0);","  const end = to.toISOString().slice(0, 10).replaceAll(\"-\", \"\");","  const start = `${request.year}0101`;","  const cacheKey = `${url}|${start}|${end}`;","  let rows = timelineCache.get(cacheKey);","  if (!rows) {","    rows = await queryWaybackCdx(url, from, to, {","      ...options,","      limit: MAX_CAPTURES + 1,","      collapse: \"timestamp:6\",","      signal: AbortSignal.any([AbortSignal.timeout(45_000), ...(options.signal ? [options.signal] : [])]),","    });","    timelineCache.set(cacheKey, rows);","  }","  const months = new Set\u003cstring>();","  const captures = rows.filter((row) => {","    if (row.mimetype !== \"text/html\" || row.statuscode !== \"200\" || !/^\\d{14}$/.test(row.timestamp)) return false;","    const date = parseCdxTimestamp(row.timestamp);","    if (!Number.isFinite(date.getTime()) || date \u003c from || date > to ||","      date.toISOString().slice(0, 19).replace(/\\D/g, \"\") !== row.timestamp) return false;","    if (!/^https?:\\/\\//i.test(row.original)) return false;","    try { normalizeUrl(row.original); } catch { return false; }","    return true;","  }).sort((a, b) => a.timestamp.localeCompare(b.timestamp)).filter((row) => {","    const month = row.timestamp.slice(0, 6);","    if (months.has(month)) return false;","    months.add(month);","    return true;","  }).slice(0, MAX_CAPTURES).map((row) => ({","    snapshot: {","      timestamp: row.timestamp,","      displayDate: formatDateForDisplay(parseCdxTimestamp(row.timestamp)),","      originalUrl: row.original,","      httpStatus: row.statuscode,","      mimetype: row.mimetype,","      digest: row.digest,","      distanceDays: Math.round(Math.abs(parseCdxTimestamp(row.timestamp).getTime() - target.getTime()) / 86_400_000),","    },","    playback: buildPlaybackUrls(row.timestamp, row.original),","  }));","  return { status: \"found\", captures, searchWindow: { from: start, to: end }, truncated: rows.length > MAX_CAPTURES };","}",""],"notes":[[1,"Reuse archive client and validation. Cache yearly rows separately from target-relative display distances."],[10,"Validate year 1996..current UTC year; create bounded start/end, cache key."],[29,"Query at most 13 monthly-collapsed rows under a deadline; target is not part of row cache because raw yearly samples do not depend on it."],[38,"Validate timestamp round-trip, date range, HTML/200 and original URL. Sort, deduplicate month with Set, cap at 12, then map to metadata/playback."],[61,"truncated means more upstream rows than returned cap, not that all historical content is known."]]},{"name":"components/TimeCapsules.tsx","lines":["\"use client\";","","import { useState, useSyncExternalStore } from \"react\";","","type Capsule = { url: string; date: string; timestamp: string };","const KEY = \"dead-internet-capsules-v1\";","function subscribe(callback: () => void) {","  window.addEventListener(\"storage\", callback);","  window.addEventListener(\"capsules-changed\", callback);","  return () => { window.removeEventListener(\"storage\", callback); window.removeEventListener(\"capsules-changed\", callback); };","}","function snapshot() { try { return localStorage.getItem(KEY) || \"[]\"; } catch { return \"[]\"; } }","function decode(raw: string): Capsule[] {","  try {","    const data: unknown = JSON.parse(raw);","    if (!Array.isArray(data)) return [];","    return data.filter((item): item is Capsule => Boolean(item && typeof item.url === \"string\" && item.url.length \u003c= 4096 && /^https?:\\/\\//.test(item.url) && typeof item.date === \"string\" && /^\\d{4}-\\d{2}-\\d{2}$/.test(item.date) && typeof item.timestamp === \"string\" && /^\\d{14}$/.test(item.timestamp))).slice(0, 20);","  } catch { return []; }","}","","export function TimeCapsules({ current, onOpen }: { current?: Capsule; onOpen: (url: string, date: string) => void }) {","  const raw = useSyncExternalStore(subscribe, snapshot, () => \"[]\");","  const capsules = decode(raw);","  const [message, setMessage] = useState(\"\");","  const saved = current && capsules.some(item => item.url === current.url && item.timestamp === current.timestamp);","  function write(next: Capsule[]) {","    try { localStorage.setItem(KEY, JSON.stringify(next)); window.dispatchEvent(new Event(\"capsules-changed\")); setMessage(\"\"); }","    catch { setMessage(\"This browser could not save the capsule. Storage may be disabled or full.\"); }","  }","  return \u003csection aria-label=\"Saved time capsules\" className=\"mt-6 rounded-xl border border-neutral-800 bg-neutral-900/30 p-5\">","    \u003cdiv className=\"flex flex-wrap items-center justify-between gap-3\">\u003cdiv>\u003ch2 className=\"text-sm font-medium text-neutral-200\">Your time capsules \u003cspan className=\"ml-2 font-mono text-xs text-lime-300\">{capsules.length}/20\u003c/span>\u003c/h2>\u003cp className=\"mt-1 text-xs text-neutral-500\">Saved in this browser. Reopening looks up the nearest capture to the saved capture date.\u003c/p>\u003c/div>","      {current && \u003cbutton type=\"button\" disabled={Boolean(saved)} className=\"workspace-link disabled:opacity-50\" onClick={() => { write([current, ...capsules].slice(0, 20)); }}> {saved ? \"✓ Capsule saved\" : \"+ Save time capsule\"}\u003c/button>}\u003c/div>","    {capsules.length > 0 ? \u003cul className=\"mt-4 grid gap-2 sm:grid-cols-2\">{capsules.map(item => \u003cli key={`${item.url}|${item.timestamp}`} className=\"flex min-w-0 items-center gap-2 rounded-lg border border-neutral-800 p-3\">\u003cbutton type=\"button\" onClick={() => onOpen(item.url, `${item.timestamp.slice(0,4)}-${item.timestamp.slice(4,6)}-${item.timestamp.slice(6,8)}`)} className=\"min-w-0 flex-1 text-left\">\u003cspan className=\"block truncate text-sm text-neutral-300\">{item.url}\u003c/span>\u003cspan className=\"font-mono text-xs text-neutral-500\">{item.timestamp.slice(0,4)} / {item.timestamp.slice(4,6)} / {item.timestamp.slice(6,8)} ↗\u003c/span>\u003c/button>\u003cbutton type=\"button\" aria-label={`Remove capsule for ${item.url}`} className=\"rounded px-2 py-2 text-neutral-500 hover:text-red-300\" onClick={() => write(capsules.filter(saved => saved !== item))}>×\u003c/button>\u003c/li>)}\u003c/ul> : \u003cp className=\"mt-4 text-sm text-neutral-500\">Find a snapshot and save your first piece of the old web.\u003c/p>}","    {message && \u003cp role=\"alert\" className=\"mt-3 text-sm text-amber-200\">{message}\u003c/p>}","  \u003c/section>;","}",""],"notes":[[1,"Browser-only bookmarks, not backend accounts."],[7,"Subscribe to cross-tab storage events AND a custom same-tab event; return unsubscribe cleanup."],[12,"Read/decode localStorage defensively, bound entry count and fields. Storage can be unavailable."],[21,"useSyncExternalStore supplies [] during server rendering. Saving/removing updates storage; reopening runs a new lookup using the stored capture DAY, not its exact second."]]},{"name":"components/RetroApp.tsx","lines":["\"use client\";","","import { useCallback, useEffect, useMemo, useRef, useState } from \"react\";","import { RETRO_STYLES, type ContentMode, type RemakeLayout, type RetroPage, type RetroResponse, type RetroStyle } from \"@/lib/retro/types\";","import { renderRetroPage } from \"@/lib/retro/render\";","import { publicActionTarget } from \"@/lib/retro/actions\";","","export function RetroApp() {","  const [url, setUrl] = useState(\"\");","  const [style, setStyle] = useState\u003cRetroStyle>(\"web95\");","  const [layout, setLayout] = useState\u003cRemakeLayout>(\"auto\");","  const [content, setContent] = useState\u003cContentMode>(\"public\");","  const [page, setPage] = useState\u003cRetroPage | null>(null);","  const [loading, setLoading] = useState(false);","  const [error, setError] = useState\u003cstring | null>(null);","  const [useAi, setUseAi] = useState(true);","  const [mobilePreview, setMobilePreview] = useState(false);","  const controller = useRef\u003cAbortController | null>(null);","  const iframe = useRef\u003cHTMLIFrameElement | null>(null);","  const previewSection = useRef\u003cHTMLElement | null>(null);","  useEffect(() => () => controller.current?.abort(), []);","  useEffect(() => {","    if (page) previewSection.current?.scrollIntoView({ behavior: \"instant\", block: \"start\" });","  }, [page]);","  const preview = useMemo(() => page ? renderRetroPage(page, style) : \"\", [page, style]);","","  const convert = useCallback(async (input = url, requestedLayout = layout, requestedContent = content) => {","    controller.current?.abort();","    const active = new AbortController();","    controller.current = active;","    setError(null);","    setLoading(true);","    try {","      const response = await fetch(useAi ? \"/api/retro/ai\" : \"/api/retro\", {","        method: \"POST\", headers: { \"Content-Type\": \"application/json\" },","        body: JSON.stringify({ url: input.trim(), layout: requestedLayout, content: requestedContent, ...(useAi ? { style } : {}) }),","        signal: AbortSignal.any([active.signal, AbortSignal.timeout(useAi ? 95_000 : 35_000)]),","      });","      const result = await response.json() as RetroResponse;","      if (result.status !== \"ready\") throw new Error(result.message);","      if (!response.ok) throw new Error(\"The website could not be converted.\");","      if (!active.signal.aborted) setPage(result.page);","    } catch (error) {","      if (!active.signal.aborted) setError(error instanceof Error ? error.message : \"Could not reach the converter. Try again.\");","    } finally {","      if (!active.signal.aborted) setLoading(false);","    }","  }, [url, layout, content, useAi, style]);","","  useEffect(() => {","    function handleMessage(event: MessageEvent) {","      // Sandboxed srcDoc has an opaque origin. Verify the exact frame window,","      // then validate the small action payload; never accept arbitrary requests.","      if (!iframe.current || event.source !== iframe.current.contentWindow || page?.remake?.content !== \"public\") return;","      const target = publicActionTarget(event.data, page.remake.kind);","      if (target) { setUrl(target); setLayout(\"auto\"); setContent(\"public\"); void convert(target, \"auto\", \"public\"); }","    }","    window.addEventListener(\"message\", handleMessage);","    return () => window.removeEventListener(\"message\", handleMessage);","  }, [convert, page]);","","  return (","    \u003cdiv className=\"retro-studio mx-auto max-w-5xl px-6 py-10\">","      \u003cheader className=\"retro-studio-hero mb-8\">","        \u003cp className=\"mb-3 font-mono text-xs uppercase tracking-[0.2em] text-amber-300\">MUTATE / Retro view\u003c/p>","        \u003ch1 className=\"max-w-3xl text-4xl font-semibold leading-tight tracking-tight sm:text-5xl\">Today&apos;s websites.\u003cbr />\u003cspan className=\"text-amber-300\">Yesterday&apos;s internet.\u003c/span>\u003c/h1>","        \u003cp className=\"mt-4 max-w-xl text-sm leading-relaxed text-neutral-400 sm:text-base\">Give a familiar corner of the web a new past. Choose how to rebuild it, pick an era, and explore your own alternate internet.\u003c/p>","        \u003cdiv className=\"mt-5 flex flex-wrap gap-2 font-mono text-[10px] uppercase tracking-wider text-neutral-500\">\u003cspan className=\"studio-tag\">Current public content\u003c/span>\u003cspan className=\"studio-tag\">Creative simulation\u003c/span>\u003cspan className=\"studio-tag\">No account needed\u003c/span>\u003c/div>","      \u003c/header>","","      \u003cfieldset className=\"engine-picker mb-7 rounded-2xl border border-neutral-800 p-5 sm:p-6\" disabled={loading}>","        \u003clegend className=\"px-2 font-mono text-xs uppercase tracking-widest text-neutral-400\">01 / Choose your engine\u003c/legend>","        \u003cdiv className=\"grid gap-3 sm:grid-cols-2\">","          \u003clabel className={`engine-option ${useAi ? \"engine-option-ai\" : \"\"}`}>\u003cspan className=\"flex items-center justify-between gap-3\">\u003cspan className=\"flex items-center gap-2 font-medium text-violet-200\">\u003cspan aria-hidden=\"true\">✦\u003c/span> AI rebuild\u003c/span>\u003cinput type=\"radio\" name=\"retro-engine\" checked={useAi} onChange={() => setUseAi(true)} className=\"accent-violet-300\" />\u003c/span>\u003cspan className=\"mt-2 block text-sm leading-relaxed text-neutral-400\">A layout planned around your page&apos;s content. An old-school look with a little new-school intelligence.\u003c/span>\u003cspan className=\"mt-4 block font-mono text-[10px] uppercase tracking-widest text-violet-300\">Gemini → Groq → classic backup\u003c/span>\u003c/label>","          \u003clabel className={`engine-option ${!useAi ? \"engine-option-classic\" : \"\"}`}>\u003cspan className=\"flex items-center justify-between gap-3\">\u003cspan className=\"font-medium text-neutral-200\">▣ Classic renderer\u003c/span>\u003cinput type=\"radio\" name=\"retro-engine\" checked={!useAi} onChange={() => setUseAi(false)} className=\"accent-amber-300\" />\u003c/span>\u003cspan className=\"mt-2 block text-sm leading-relaxed text-neutral-400\">Instant, handcrafted templates. Familiar retro layouts, with no AI request required.\u003c/span>\u003cspan className=\"mt-4 block font-mono text-[10px] uppercase tracking-widest text-amber-300\">Fast preview / no AI API needed\u003c/span>\u003c/label>","        \u003c/div>","        \u003cp className=\"mt-4 text-xs leading-relaxed text-neutral-500\">{useAi ? \"AI receives bounded page text and your theme through Gemini, or Groq if needed. Public content only; no account or private session is accessed. If both are unavailable, a labeled classic preview takes over.\" : \"Classic mode is selected. Choose AI rebuild above for a custom layout plan. Both modes preserve source text and links.\"}\u003c/p>","      \u003c/fieldset>","","      \u003cfieldset className=\"mb-7\" disabled={loading}>","        \u003clegend className=\"mb-4 font-mono text-xs uppercase tracking-widest text-neutral-400\">02 / Choose your era\u003c/legend>","        \u003cdiv className=\"grid gap-3 sm:grid-cols-3\">","          {RETRO_STYLES.map(option => \u003clabel key={option.id}","            className={`era-option cursor-pointer rounded-xl border p-4 ${style === option.id ? \"border-amber-300 bg-amber-300/5\" : \"border-neutral-800 bg-neutral-900/50 hover:border-neutral-500\"}`}>","            \u003cdiv aria-hidden=\"true\" className={`mb-4 h-14 overflow-hidden border-2 p-2 ${option.id === \"web95\" ? \"border-neutral-400 bg-[#c0c0c0]\" : option.id === \"portal\" ? \"border-blue-400 bg-[#061839]\" : \"border-neutral-300 bg-[#008080]\"}`}>","              \u003cdiv className={`h-2 w-3/4 ${option.id === \"web95\" ? \"bg-neutral-600\" : option.id === \"portal\" ? \"bg-yellow-300\" : \"bg-[#000080]\"}`} />","              \u003cdiv className=\"mt-2 flex gap-1\">\u003cspan className=\"h-5 w-1/4 bg-white/50\" />\u003cspan className=\"h-5 w-3/4 bg-white/80\" />\u003c/div>","            \u003c/div>","            \u003cspan className=\"flex items-center gap-2 font-medium\">\u003cinput type=\"radio\" name=\"retro-style\" value={option.id}","              checked={style === option.id} onChange={() => setStyle(option.id)} className=\"accent-amber-300\" />{option.name}\u003c/span>","            \u003cspan className=\"mt-2 block text-sm text-neutral-400\">{option.description}\u003c/span>","          \u003c/label>)}","        \u003c/div>","      \u003c/fieldset>","","","","      \u003cform onSubmit={event => { event.preventDefault(); void convert(); }} className=\"studio-source mb-4 grid gap-4 rounded-2xl border border-neutral-800 bg-neutral-900/40 p-5 sm:grid-cols-[minmax(0,1fr)_180px] sm:p-6\">","        \u003cp className=\"font-mono text-xs uppercase tracking-widest text-neutral-400 sm:col-span-2\">03 / Bring a website\u003c/p>","        \u003clabel className=\"flex min-w-0 flex-col gap-2 text-sm text-neutral-300\">","          Website URL","          \u003cinput value={url} onChange={event => setUrl(event.target.value)} required maxLength={4096}","            placeholder=\"e.g. youtube.com\" spellCheck={false} autoComplete=\"url\" disabled={loading}","            className=\"min-w-0 rounded-lg border border-neutral-700 bg-neutral-950 px-3 py-3 text-base text-neutral-100 outline-none focus:border-amber-300\" />","        \u003c/label>","        \u003clabel className=\"flex flex-col gap-2 text-sm text-neutral-300\">Content source","          \u003cselect aria-label=\"Content source\" value={content} onChange={event => setContent(event.target.value as ContentMode)}","            disabled={loading} className=\"rounded-lg border border-neutral-700 bg-neutral-950 px-3 py-3 text-base text-neutral-100\">","            \u003coption value=\"public\">Public data\u003c/option>\u003coption value=\"sample\">Sample design\u003c/option>","          \u003c/select>","        \u003c/label>","        \u003cdetails className=\"text-sm text-neutral-400 sm:col-span-2\">\u003csummary className=\"w-fit cursor-pointer py-1\">Advanced layout options\u003c/summary>\u003clabel className=\"mt-3 flex max-w-xs flex-col gap-2 text-sm text-neutral-300\">Remake layout","          \u003cselect aria-label=\"Remake layout\" value={layout} onChange={event => setLayout(event.target.value as RemakeLayout)}","            disabled={loading} className=\"rounded-lg border border-neutral-700 bg-neutral-950 px-3 py-3 text-base text-neutral-100\">","            \u003coption value=\"auto\">Auto-detect website\u003c/option>","            \u003coption value=\"youtube\">Video site\u003c/option>\u003coption value=\"facebook\">Social network\u003c/option>","            \u003coption value=\"github\">Code hosting\u003c/option>\u003coption value=\"website\">Website · public content\u003c/option>","          \u003c/select>","        \u003c/label>\u003cp className=\"mt-2 text-xs leading-relaxed text-neutral-500\">Auto-detect works best for supported websites. AI uses normalized text with its own layout plan.\u003c/p>\u003c/details>","        \u003cdiv className=\"flex flex-wrap items-center justify-between gap-4 border-t border-neutral-800 pt-4 sm:col-span-2\">\u003cp className=\"text-xs text-neutral-500\">{RETRO_STYLES.find(option => option.id === style)?.name} \u003cspan className=\"mx-1\">/\u003c/span> {useAi ? \"AI rebuild\" : \"Classic renderer\"}\u003c/p>\u003cbutton type=\"submit\" disabled={loading} className={`w-full rounded-lg px-6 py-3 text-sm font-semibold text-neutral-950 disabled:opacity-50 sm:w-auto ${useAi ? \"bg-violet-200 hover:bg-violet-100\" : \"bg-amber-300 hover:bg-amber-200\"}`}>","          {loading ? (useAi ? \"Planning your remake…\" : \"Building your remake…\") : useAi ? \"✦ Rebuild with AI →\" : \"Create retro preview →\"}","        \u003c/button>\u003c/div>","      \u003c/form>","      \u003cdiv className=\"mb-4 flex flex-wrap items-center gap-2 text-sm text-neutral-400\">","        \u003cspan>Try a remake:\u003c/span>","        {[{ label: \"YouTube\", url: \"https://youtube.com\", content: \"public\" }, { label: \"Facebook demo\", url: \"https://facebook.com\", content: \"sample\" }, { label: \"GitHub\", url: \"https://github.com/octocat/Hello-World\", content: \"public\" }].map(example =>","          \u003cbutton type=\"button\" key={example.url} disabled={loading} className=\"rounded-full border border-neutral-800 px-3 py-1.5 text-xs hover:border-neutral-600 hover:text-neutral-100 disabled:opacity-50\"","            onClick={() => { setUrl(example.url); setLayout(\"auto\"); setContent(example.content as ContentMode); void convert(example.url, \"auto\", example.content as ContentMode); }}>{example.label}\u003c/button>)}","      \u003c/div>","      \u003cp className=\"max-w-3xl text-sm text-neutral-500\">Public data loads actual YouTube videos and GitHub repository files. A plain YouTube URL starts a public “retro computing” search. Facebook and other layout experiments use Sample design. No account is connected.\u003c/p>","","      {loading && \u003cdiv className=\"mt-6 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-neutral-800 p-4\">\u003cp role=\"status\" className=\"font-mono text-xs text-amber-200\">{useAi ? \"Reading public content and planning a retro layout…\" : \"Rebuilding the website for another era…\"}{page ? \" Your previous preview remains below.\" : \"\"}\u003c/p>\u003cbutton type=\"button\" className=\"workspace-link\" onClick={() => { controller.current?.abort(); setLoading(false); }}>Cancel\u003c/button>\u003c/div>}","      {error && \u003cdiv role=\"alert\" className=\"mt-6 rounded border border-amber-800 bg-amber-950/20 p-4 text-sm text-amber-200\">","        {error}{page ? \" Your previous preview remains below.\" : \"\"}\u003cbutton type=\"button\" onClick={() => void convert()} className=\"ml-3 underline underline-offset-4\">Try again\u003c/button>","      \u003c/div>}","      {page && \u003csection ref={previewSection} aria-label=\"Retro preview\" className=\"mt-8 scroll-mt-5\">","        \u003cp role=\"status\" className={`mb-4 rounded-xl border p-4 text-sm font-medium ${page.ai ? \"border-violet-400/40 bg-violet-400/10 text-violet-200\" : \"border-amber-800 bg-amber-950/20 text-amber-200\"}`}>{page.ai ? `✦ AI redesign complete · ${page.ai.layout} layout · ${page.ai.provider === \"groq\" ? \"Groq\" : \"Gemini\"}` : page.aiFallback ? \"AI was unavailable — showing a classic preview instead.\" : \"Classic preview ready · no AI was used.\"}\u003c/p>","        \u003cdiv className=\"mb-3 flex flex-wrap items-center justify-between gap-3\">","          \u003cdiv>\u003cp role=\"status\" className=\"font-mono text-sm text-amber-300\">SIMULATED · {RETRO_STYLES.find(option => option.id === style)?.name}\u003c/p>","            \u003cp className=\"mt-1 text-sm text-neutral-400\">{page.ai?.sourceMode === \"sample\" ? \"AI layout plan · illustrative sample content\" : page.remake?.content === \"public\" ? \"Real public source content · simulated retro layout\" : page.remake ? \"Interactive design remake · illustrative sample content\" : \"A creative remake of current public content\"}. Change styles instantly above.\u003c/p>\u003c/div>","          \u003ca href={page.sourceUrl} target=\"_blank\" rel=\"noopener noreferrer\" className=\"text-sm text-neutral-300 underline underline-offset-4\">Open original website ↗\u003c/a>","        \u003c/div>","        {page.remake && \u003cp className=\"mb-3 rounded border border-amber-900 bg-amber-950/20 p-3 text-sm text-amber-200\">{page.remake.notice}\u003c/p>}","        {page.aiFallback && \u003cp role=\"status\" className=\"mb-4 rounded-xl border border-amber-800 bg-amber-950/20 p-4 text-sm text-amber-200\">\u003cstrong>Classic fallback active.\u003c/strong> {page.aiFallback}\u003c/p>}","        {page.ai && \u003cdiv className=\"mb-4 rounded-xl border border-violet-400/30 bg-violet-400/5 p-4\">\u003cp className=\"font-mono text-xs text-violet-200\">AI REMAKE · SIMULATED · {page.ai.layout} layout · {page.ai.provider === \"groq\" ? \"Groq backup\" : \"Google Gemini\"} · {page.ai.model}\u003c/p>\u003cp className=\"mt-2 text-sm text-neutral-300\">{page.ai.rationale}\u003c/p>\u003cp className=\"mt-2 text-xs text-neutral-500\">AI chose this layout and content order. Text-first preview; source links open the original website. This is not a historical record. Theme changes restyle this plan; rebuild to create a new one.\u003c/p>\u003c/div>}","        \u003cp className=\"mb-3 break-all text-xs text-neutral-500\">{page.remake?.content === \"sample\" ? \"Design reference\" : \"Source\"}: {page.sourceUrl} · {page.remake?.content === \"sample\" ? \"Created\" : \"Retrieved\"} {new Date(page.fetchedAt).toLocaleString(\"en-US\", { timeZone: \"UTC\" })} (UTC){page.truncated ? \" · Content shortened\" : \"\"}\u003c/p>","        \u003cdiv className=\"preview-browser overflow-hidden rounded-xl border border-neutral-700 bg-neutral-900\">","          \u003cdiv className=\"flex flex-wrap items-center gap-3 border-b border-neutral-700 px-4 py-3\">\u003cspan aria-hidden=\"true\" className=\"flex gap-1.5\">\u003ci className=\"h-2 w-2 rounded-full bg-red-400/60\" />\u003ci className=\"h-2 w-2 rounded-full bg-amber-300/60\" />\u003ci className=\"h-2 w-2 rounded-full bg-lime-300/60\" />\u003c/span>\u003cspan className=\"min-w-0 flex-1 truncate font-mono text-xs text-neutral-500\">{page.sourceUrl}\u003c/span>\u003cdiv role=\"group\" aria-label=\"Preview size\" className=\"flex gap-1\">\u003cbutton type=\"button\" aria-pressed={!mobilePreview} onClick={() => setMobilePreview(false)} className={`rounded px-2 py-1 text-xs ${!mobilePreview ? \"bg-neutral-700 text-white\" : \"text-neutral-400\"}`}>Full width\u003c/button>\u003cbutton type=\"button\" aria-pressed={mobilePreview} onClick={() => setMobilePreview(true)} className={`rounded px-2 py-1 text-xs ${mobilePreview ? \"bg-neutral-700 text-white\" : \"text-neutral-400\"}`}>Mobile\u003c/button>\u003c/div>\u003c/div>","          \u003cdiv className=\"overflow-hidden bg-neutral-950/50\">\u003ciframe ref={iframe} title=\"Retro website preview\" srcDoc={preview} sandbox={page.remake ? \"allow-scripts allow-popups allow-popups-to-escape-sandbox\" : \"allow-popups allow-popups-to-escape-sandbox\"}","          referrerPolicy=\"no-referrer\" className={`mx-auto block h-[80vh] min-h-[540px] w-full border-0 bg-white ${mobilePreview ? \"max-w-[390px]\" : \"\"}`} />\u003c/div>","        \u003c/div>","      \u003c/section>}","    \u003c/div>","  );","}",""],"notes":[[1,"Retro UI/controller imports trusted renderer and small message validator."],[8,"State: source, theme, layout, public/sample mode, previous page, AI flag (default true), loading/errors and mobile width. Refs track current request and frame."],[21,"Cleanup cancels on unmount; new page scrolls into view. useMemo rerenders HTML only when page/style changes."],[27,"Cancel old work; select classic or AI API; send validated choices; retain old page on error. Browser deadlines differ for AI/classic."],[50,"Accept messages only from the exact iframe window AND public platform preview; validate action before issuing a new server read. Opaque origin cannot provide a useful ordinary origin check."],[62,"Engine, era and source controls. Public-source and sample modes are explicitly separate."],[132,"Loading/cancel/retry preserve prior preview; status distinguishes AI completion from labeled classic fallback."],[145,"Show planner provider/model/rationale and source time; this is simulated current content, not an authentic historical capture."],[149,"srcDoc is generated trusted markup inside an opaque sandbox. Only platform remakes permit the fixed local script; AI/generic layouts do not. No same-origin permission."]]},{"name":"app/api/retro/route.ts","lines":["import { fetchPublicPage, retroUrl } from \"@/lib/retro/fetch\";","import { createRemake, detectRemake } from \"@/lib/retro/remake\";","import { publicRemake } from \"@/lib/retro/public-content\";","import { extractRetroPage } from \"@/lib/retro/extract\";","import { RetroError } from \"@/lib/retro/errors\";","import type { RetroResponse } from \"@/lib/retro/types\";","","export async function POST(request: Request) {","  try {","    let body: unknown;","    try { body = await request.json(); } catch {","      throw new RetroError(\"invalid_input\", \"Enter a website URL to convert.\");","    }","    if (!body || typeof body !== \"object\" || !(\"url\" in body) || typeof body.url !== \"string\") {","      throw new RetroError(\"invalid_input\", \"Enter a website URL to convert.\");","    }","    const layout = \"layout\" in body ? body.layout : \"auto\";","    if (typeof layout !== \"string\" || ![\"auto\", \"website\", \"youtube\", \"facebook\", \"github\"].includes(layout)) {","      throw new RetroError(\"invalid_input\", \"Choose a supported remake layout.\");","    }","    const url = retroUrl(body.url);","    const content = \"content\" in body ? body.content : \"public\";","    if (content !== \"public\" && content !== \"sample\") throw new RetroError(\"invalid_input\", \"Choose Public data or Sample design.\");","    const kind = layout === \"auto\" ? detectRemake(url) : layout === \"website\" ? undefined : layout as \"youtube\" | \"facebook\" | \"github\";","    if (kind) {","      const page = content === \"sample\" ? createRemake(url, kind) : await publicRemake(url, kind, request.signal);","      return Response.json({ status: \"ready\", page } satisfies RetroResponse, { headers: { \"Cache-Control\": \"no-store\" } });","    }","    const source = await fetchPublicPage(body.url, { signal: request.signal });","    const page = extractRetroPage(source.body, source.url, source.contentType);","    return Response.json({ status: \"ready\", page } satisfies RetroResponse, { headers: { \"Cache-Control\": \"no-store\" } });","  } catch (error) {","    const result: RetroResponse = error instanceof RetroError","      ? { status: error.status, message: error.message }","      : { status: \"unavailable\", message: \"The website could not be converted. Try another public page.\" };","    return Response.json(result, {","      status: result.status === \"invalid_input\" ? 400 : result.status === \"unsupported\" ? 422 : 502,","      headers: { \"Cache-Control\": \"no-store\" },","    });","  }","}",""],"notes":[[1,"Classic data-source API; no model dependency."],[8,"Parse body, validate supported layout, URL and public/sample content mode."],[24,"Auto-detect platform: explicit samples create demo data; public mode reads a supported adapter and never silently replaces failures with samples."],[30,"Generic source uses safe fetch + semantic extraction. All ready results are structured content, not remote executable HTML."],[33,"Map known invalid/unsupported/unavailable errors to 400/422/502; response is no-store."]]},{"name":"lib/retro/fetch.ts","lines":["import { lookup } from \"node:dns/promises\";","import type { LookupAddress } from \"node:dns\";","import { request as httpRequest } from \"node:http\";","import { request as httpsRequest } from \"node:https\";","import { isIP } from \"node:net\";","import ipaddr from \"ipaddr.js\";","import { RetroError } from \"./errors\";","","export const MAX_PAGE_BYTES = 1_500_000;","","export function publicAddress(address: string): boolean {","  try { return ipaddr.process(address).range() === \"unicast\"; } catch { return false; }","}","","export function retroUrl(input: string): URL {","  const trimmed = input.trim();","  if (!trimmed || trimmed.length > 4096) throw new RetroError(\"invalid_input\", \"Enter a public website URL.\");","  let url: URL;","  try {","    url = new URL(/^[a-z][a-z\\d+.-]*:\\/\\//i.test(trimmed) ? trimmed : `https://${trimmed}`);","  } catch { throw new RetroError(\"invalid_input\", \"Enter a valid website URL.\"); }","  if (![\"http:\", \"https:\"].includes(url.protocol) || url.username || url.password ||","    (url.port && url.port !== (url.protocol === \"https:\" ? \"443\" : \"80\"))) {","    throw new RetroError(\"invalid_input\", \"Use a public HTTP or HTTPS URL without credentials or a custom port.\");","  }","  const hostname = url.hostname.replace(/^\\[|\\]$/g, \"\");","  if (hostname.includes(\"%\") || (!isIP(hostname) && (!hostname.includes(\".\") ||","    /\\.(localhost|local|internal|test|invalid|example|onion)\\.?$/i.test(hostname)))) {","    throw new RetroError(\"invalid_input\", \"Only public Internet websites can be converted.\");","  }","  if (isIP(hostname) && !publicAddress(hostname)) {","    throw new RetroError(\"invalid_input\", \"Only public Internet websites can be converted.\");","  }","  url.hash = \"\";","  return url;","}","","export interface PageResponse {","  status: number;","  location?: string;","  contentType: string;","  body: Buffer;","  mementoDatetime?: string;","}","","export interface ReadPolicy {","  maxBytes?: number;","  accept?: string;","  contentTypes?: string[];","}","","// Pin a validated DNS address so the socket cannot resolve to a different/private IP.","export async function readPage(url: URL, address: LookupAddress, signal: AbortSignal, policy: ReadPolicy = {}): Promise\u003cPageResponse> {","  const maxBytes = Math.min(policy.maxBytes ?? MAX_PAGE_BYTES, 5_000_000);","  return new Promise((resolve, reject) => {","    const request = (url.protocol === \"https:\" ? httpsRequest : h st addresses = isIP(hostname)","        ? [{ address: hostname, family: isIP(hostname) }]","        : await abortable((options.resolve ?? (host => lookup(host, { all: true })))(hostname), signal);","      if (!addresses.length || addresses.some(address => !publicAddress(address.address))) {","        throw new RetroError(\"invalid_input\", \"Only public Internet websites can be converted.\");","      }","      // Prefer IPv4 where available; the Host header and TLS name remain the source hostname.","      const address = addresses.find(address => address.family === 4) ?? addresses[0];","      const result = await (options.read ?? readPage)(url, address, signal, options.policy);","      if (result.status >= 300 && result.status \u003c 400) {","        if (!result.location || redirect === 4) throw new RetroError(\"unavailable\", \"The website redirected too many times or returned an invalid redirect.\");","        url = retroUrl(new URL(result.location, url).toString());","        continue;","      }","      return { body: result.body, url: url.toString(), contentType: result.contentType,","        ...(result.mementoDatetime ? { mementoDatetime: result.mementoDatetime } : {}),","      };","    }","    throw new RetroError(\"unavailable\", \"The website could not be loaded.\");","  } catch (error) {","    if (error instanceof RetroError) throw error;","    if (signal.aborted) throw new RetroError(\"unavailable\", \"The website took too long to respond. Try again or choose another page.\");","    throw new RetroError(\"unavailable\", \"Could not load this website. It may block automated access or be offline.\");","  }","}",""],"notes":[[1,"Node DNS/socket tools and IP range library protect server-side URL reads. Browser CORS does not solve this threat."],[11,"publicAddress rejects non-public ranges, including mapped addresses processed by ipaddr.js."],[15,"Parse bounded URL; allow HTTP(S), no credentials/custom port, reject local/special hosts and literal private IPs; remove fragments."],[38,"Typed response and MIME/size policy let GitHub JSON and archive HTML reuse the reader."],[53,"Pin validated address in socket lookup, retain original host/TLS name, disable pooled agent, request identity encoding."],[69,"Handle redirect response without consuming its body; reject non-success status and unsupported type/encoding."],[89,"Check claimed Content-Length AND streamed actual bytes; destroy over-limit response and concatenate only bounded chunks."],[116,"Race DNS resolution with abort signal and remove listener on settlement. DNS work itself may still finish after caller cancellation."],[125,"Overall 20-second reader signal; each redirect repeats host allowlist, URL, DNS and public-IP validation."],[142,"Reject if ANY DNS answer is private; choose validated IPv4 where possible. Follow at most four redirects, then return bounded bytes; map errors."]]},{"name":"lib/retro/extract.ts","lines":["import { loadBuffer } from \"cheerio\";","import type { RetroBlock, RetroPage } from \"./types\";","import { RetroError } from \"./errors\";","","const clean = (text: string) => text.replace(/\\s+/g, \" \").trim();","","export function extractRetroPage(body: Buffer, sourceUrl: string, contentType = \"\"): RetroPage {","  const encoding = /charset\\s*=\\s*[\"']?([^;\\s\"']+)/i.exec(contentType)?.[1];","  const $ = loadBuffer(body, encoding ? { encoding: { transportLayerEncodingLabel: encoding } } : {});","  const title = clean($(\"title\").first().text() || $(\"h1\").first().text() || new URL(sourceUrl).hostname).slice(0, 180);","  const description = clean($(\"meta[name='description']\").attr(\"content\") ?? \"\").slice(0, 420);","  $(\"script,style,noscript,iframe,object,embed,svg,canvas,template,form,[hidden],[aria-hidden='true']\").remove();","  $(\"[style]\").filter((_index, element) => /(?:display\\s*:\\s*none|visibility\\s*:\\s*hidden)/i.test($(element).attr(\"style\") ?? \"\")).remove();","","  const links: RetroPage[\"links\"] = [];","  const seenLinks = new Set\u003cstring>();","  // Keep recognizable site navigation, then useful in-page links.","  $(\"nav a[href], [role='navigation'] a[href]\").add($(\"main a[href], article a[href], body a[href]\")).each((_index, element) => {","    if (links.length >= 24) return false;","    const label = clean($(element).text()).slice(0, 90);","    const href = $(element).attr(\"href\");","    if (!label || !href || href.startsWith(\"#\")) return;","    try {","      const url = new URL(href, sourceUrl);","      if (![\"http:\", \"https:\"].includes(url.protocol) || url.username || url.password || seenLinks.has(url.href)) return;","      seenLinks.add(url.href);","      links.push({ label, url: url.href });","    } catch { /* Ignore malformed source links. */ }","  });","  $(\"nav,[role='navigation'],footer\").remove();","  const main = $(\"main,[role='main']\").first();","  const article = $(\"article\").first();","  const root = main.length ? main : article.length ? article : $(\"body\");","  const blocks: RetroBlock[] = [];","  const selector = \"h1,h2,h3,h4,p,li,blockquote,pre\";","  let total = 0;","  let truncated = false;","  root.find(selector).each((_index, element) => {","    if ($(element).parentsUntil(root).filter(selector).length) return;","    const raw = element.tagName === \"pre\" ? $(element).text().trim() : clean($(element).text());","    if (!raw) return;","    if (blocks.length >= 100 || total >= 60_000) { truncated = true; return false; }","    const text = raw.slice(0, Math.min(2400, 60_000 - total));","    if (text.length \u003c raw.length) truncated = true;","    total += text.length;","    const tag = element.tagName;","    blocks.push({","      kind: /^h[1-4]$/.test(tag) ? \"heading\" : tag === \"li\" ? \"item\" : tag === \"blockquote\" ? \"quote\" : tag === \"pre\" ? \"code\" : \"paragraph\",","      text,","      ...(/^h[1-4]$/.test(tag) ? { level: Number(tag[1]) } : {}),","    });","  });","  if (!blocks.length) {","    const text = cl ideo.longBylineText) || text(video.shortBylineText), text(video.lengthText));","    }","    const lockup = record(object.lockupViewModel);","    if (lockup.contentType === \"LOCKUP_CONTENT_TYPE_VIDEO\") {","      const metadata = record(record(lockup.metadata).lockupMetadataViewModel);","      const thumbnail = record(record(lockup.contentImage).thumbnailViewModel);","      let duration = \"\";","      if (Array.isArray(thumbnail.overlays)) {","        for (const overlay of thumbnail.overlays) {","          const badges = record(record(overlay).thumbnailBottomOverlayViewModel).badges;","          if (Array.isArray(badges)) {","            for (const badge of badges) duration ||= text(record(record(badge).thumbnailBadgeViewModel).text);","          }","        }","      }","      add(lockup.contentId, text(metadata.title), channelTitle, duration);","    }","    const values = Object.entries(object).filter(([key]) => !/adSlot|adPlacement|promoted/i.test(key)).map(([, value]) => value);","    for (let index = values.length - 1; index >= 0; index--) stack.push(values[index]);","  }","  return videos;","}","","export function youtubeSource(input: URL): { url: URL; query: string } {","  if (detectRemake(input) !== \"youtube\") throw new RetroError(\"unsupported\", \"Public video data requires a YouTube URL. Choose Sample design for other video-site remakes.\");","  const target = new URL(\"https://www.youtube.com\");","  let query = \"\";","  const shortId = input.hostname === \"youtu.be\" ? input.pathname.slice(1) : input.pathname.startsWith(\"/shorts/\") ? input.pathname.split(\"/\")[2] : input.searchParams.get(\"v\");","  if (shortId) {","    if (!/^[\\w-]{11}$/.test(shortId)) throw new RetroError(\"invalid_input\", \"Enter a valid YouTube video URL.\");","    target.pathname = \"/watch\"; target.searchParams.set(\"v\", shortId);","  } else if (input.pathname === \"/\" || input.pathname === \"/results\") {","    query = input.searchParams.get(\"search_query\")?.trim().
